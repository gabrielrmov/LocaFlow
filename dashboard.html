<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locarion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F6FB; --surface:#FFFFFF; --surface-2:#EEF0F9; --surface-hover:#F7F8FD;
  --border:#E2E4F0; --border-strong:#CDD1E6;
  --ink:#12172B; --ink-2:#565C74; --ink-muted:#8B90A8;
  --accent:#1E3A5F; --accent-ink:#FFFFFF; --accent-hover:#16304C; --accent-soft:#E8ECF2; --accent-soft-ink:#1E3A5F;
  --good:#127A2E; --good-bg:#E3F6EA; --good-dot:#0CA30C;
  --warning:#8A5A05; --warning-bg:#FCEFD9; --warning-dot:#F1A324;
  --critical:#C22F2F; --critical-bg:#FBE7E7; --critical-dot:#D03B3B;
  --neutral-ink:#5B6178; --neutral-bg:#EEF0F5;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#c98500; --series-5:#e87ba4;
  --shadow-sm:0 1px 2px rgba(18,23,43,.07),0 1px 1px rgba(18,23,43,.04);
  --shadow-md:0 10px 28px rgba(18,23,43,.12);
  --radius-sm:6px; --radius-md:9px; --radius-lg:13px;
  --font-display:'Sora',system-ui,-apple-system,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0D; --surface:#16171C; --surface-2:#1E2027; --surface-hover:#25272F;
    --border:#282A33; --border-strong:#3A3D49;
    --ink:#F2F2F2; --ink-2:#B4B4B4; --ink-muted:#7E829A;
    --accent:#4A8CE8; --accent-ink:#08101F; --accent-hover:#6BA0EC; --accent-soft:#152A47; --accent-soft-ink:#9CC5F2;
    --good:#3DDC7A; --good-bg:#132A1D; --good-dot:#3DDC7A;
    --warning:#F5B84A; --warning-bg:#2E2410; --warning-dot:#F5B84A;
    --critical:#FF6B6B; --critical-bg:#331818; --critical-dot:#FF6B6B;
    --neutral-ink:#ABABAB; --neutral-bg:#22242C;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181;
    --shadow-sm:0 1px 2px rgba(0,0,0,.5),0 1px 1px rgba(0,0,0,.35);
    --shadow-md:0 14px 34px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0D; --surface:#16171C; --surface-2:#1E2027; --surface-hover:#25272F;
  --border:#282A33; --border-strong:#3A3D49;
  --ink:#F2F2F2; --ink-2:#B4B4B4; --ink-muted:#7E829A;
  --accent:#4A8CE8; --accent-ink:#08101F; --accent-hover:#6BA0EC; --accent-soft:#152A47; --accent-soft-ink:#9CC5F2;
  --good:#3DDC7A; --good-bg:#132A1D; --good-dot:#3DDC7A;
  --warning:#F5B84A; --warning-bg:#2E2410; --warning-dot:#F5B84A;
  --critical:#FF6B6B; --critical-bg:#331818; --critical-dot:#FF6B6B;
  --neutral-ink:#ABABAB; --neutral-bg:#22242C;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5),0 1px 1px rgba(0,0,0,.35);
  --shadow-md:0 14px 34px rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; margin:0; text-wrap:balance; color:var(--ink)}
p{margin:0}
a{color:var(--accent)}
button{font-family:inherit}
::selection{background:var(--accent-soft)}
.tabular{font-variant-numeric:tabular-nums}
.hint{color:var(--ink-muted); font-size:12.5px}

/* ---------- layout ---------- */
#app{display:flex; min-height:100%; background:radial-gradient(1200px 560px at 20% -10%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 60%) var(--bg);}
.sidebar{
  width:240px; flex:0 0 240px; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:18px 14px; gap:18px;
  position:fixed; top:0; bottom:0; left:0; z-index:40; transition:transform .2s ease;
  padding-top:calc(18px + env(safe-area-inset-top,0px));
}
.brand{display:flex; align-items:center; gap:9px; padding:0 6px}
.brand-mark{
  width:26px; height:26px; border-radius:6px; background:var(--accent);
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.brand-name{font-family:var(--font-display); font-weight:700; font-size:16px; letter-spacing:-.015em}
.nav-scroll{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:16px}
.nav-group-label{font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); padding:0 10px; margin-bottom:6px}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius-sm);
  color:var(--ink-2); text-decoration:none; font-weight:500; font-size:13.5px; cursor:pointer; border:none; background:none;
  width:100%; text-align:left;
}
.nav-item:hover{background:var(--surface-hover); color:var(--ink)}
.nav-item.active{background:var(--accent-soft); color:var(--accent-soft-ink); font-weight:600}
.nav-item .ic{width:18px; height:18px; flex:0 0 auto; opacity:.9}
.nav-item .count{margin-left:auto; font-size:11px; background:var(--surface-2); color:var(--ink-muted); border-radius:99px; padding:1px 7px; font-weight:600}
.nav-item.active .count{background:rgba(255,255,255,.35); color:var(--accent-soft-ink)}
.sidebar-footer{border-top:1px solid var(--border); padding-top:12px; display:flex; flex-direction:column; gap:8px}
.plan-chip{display:flex; align-items:center; justify-content:space-between; padding:9px 10px; border-radius:var(--radius-sm); background:var(--surface-2); font-size:12px}
.plan-chip b{font-family:var(--font-display); font-size:12.5px}
.theme-toggle{display:flex; gap:4px; background:var(--surface-2); border-radius:99px; padding:3px}
.theme-toggle button{flex:1; border:none; background:none; padding:6px 0; border-radius:99px; font-size:11.5px; font-weight:600; color:var(--ink-muted); cursor:pointer}
.theme-toggle button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm)}

.backdrop{display:none; position:fixed; inset:0; background:rgba(10,12,30,.45); z-index:35}
.main{flex:1; margin-left:240px; display:flex; flex-direction:column; min-width:0}
.topbar{
  position:sticky; top:0; z-index:20; background:var(--bg); background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--border);
  padding:14px 26px; padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex; align-items:center; gap:14px; min-height:30px;
}
.menu-toggle{display:none; border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-sm); width:34px; height:34px; align-items:center; justify-content:center; cursor:pointer; color:var(--ink)}
.topbar h1{font-size:19px}
.topbar-actions{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.view{padding:22px 28px 60px; max-width:1440px}

/* ---------- buttons & inputs ---------- */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:var(--radius-sm);
  font-size:13.5px; font-weight:600; border:1px solid transparent; cursor:pointer; white-space:nowrap;
  transition:background .12s ease, border-color .12s ease;
}
.btn svg{width:15px; height:15px}
.btn-primary{background:var(--accent); color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--surface); color:var(--ink); border-color:var(--border-strong)}
.btn-secondary:hover{background:var(--surface-hover)}
.btn-ghost{background:transparent; color:var(--ink-2); border-color:transparent}
.btn-ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn-danger{background:transparent; color:var(--critical); border-color:transparent}
.btn-danger:hover{background:var(--critical-bg)}
.btn-sm{padding:6px 10px; font-size:12.5px; border-radius:7px}
.btn:disabled{opacity:.5; cursor:not-allowed}
.icon-btn{position:relative; width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-2); cursor:pointer}
.alert-badge{position:absolute; top:-5px; right:-5px; min-width:16px; height:16px; padding:0 4px; border-radius:99px; background:var(--critical-dot); color:#fff; font-size:10px; font-weight:800; line-height:16px; text-align:center; border:2px solid var(--surface)}
.icon-btn:hover{background:var(--surface-hover); color:var(--ink)}
.icon-btn.active{background:var(--accent); color:#fff; border-color:var(--accent)}

.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:12.5px; font-weight:600; color:var(--ink-2)}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.input,.select,.textarea{
  font-family:inherit; font-size:13.5px; padding:9px 11px; border-radius:var(--radius-sm);
  border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); width:100%;
}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--accent); outline-offset:1px}
.textarea{resize:vertical; min-height:64px}
.search-wrap{position:relative; flex:1; min-width:180px; max-width:320px}
.search-wrap svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-muted)}
.search-wrap .input{padding-left:32px}
.filters-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
.checklist{display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto; border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px}
.checklist label{display:flex; align-items:center; gap:8px; font-size:13px; padding:5px 6px; border-radius:6px}
.checklist label:hover{background:var(--surface-2)}
.checklist label.disabled{opacity:.45}

/* ---------- cards / kpis ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-sm)}
.card-pad{padding:18px}
.section-title{font-size:15px; margin-bottom:2px}
.section-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
.section-head p.hint{margin-top:2px}
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:1px; margin-bottom:22px; border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; background:var(--border); box-shadow:var(--shadow-sm)}
.kpi{background:var(--surface); padding:16px 17px; transition:background .12s ease}
.kpi:hover{background:var(--surface-hover)}
.kpi-top{margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:8px}
.kpi-label{font-size:11.5px; color:var(--ink-muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em}
.kpi-icon{width:26px; height:26px; border-radius:7px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto}
.kpi-icon svg{width:14px; height:14px}
.kpi-icon.accent{background:var(--accent-soft); color:var(--accent-soft-ink)}
.kpi-icon.warning{background:var(--warning-bg); color:var(--warning)}
.kpi-icon.critical{background:var(--critical-bg); color:var(--critical)}
.kpi-icon.neutral{background:var(--neutral-bg); color:var(--neutral-ink)}
.kpi-value{font-family:var(--font-display); font-size:25px; font-weight:700}
.kpi-sub{font-size:11.5px; color:var(--ink-muted); margin-top:5px}
.grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:16px}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
.stack{display:flex; flex-direction:column; gap:16px}

/* ---------- quick actions & onboarding ---------- */
.quick-actions{display:grid; grid-template-columns:1fr; gap:8px}
.quick-action{display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface); cursor:pointer; text-align:left; font-family:inherit; transition:background .12s ease, border-color .12s ease, transform .12s ease}
.quick-action:hover{background:var(--surface-hover); border-color:var(--border-strong); transform:translateY(-1px)}
.quick-action .qa-icon{width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent-soft-ink); flex:0 0 auto}
.quick-action .qa-icon svg{width:16px; height:16px}
.quick-action .qa-label{font-size:12.5px; font-weight:600; color:var(--ink)}

.onboard-hero{background:linear-gradient(160deg, color-mix(in srgb, var(--accent) 10%, var(--surface)), var(--surface)); border:1px solid var(--border); border-radius:var(--radius-lg); padding:28px; margin-bottom:18px; box-shadow:var(--shadow-sm)}
.onboard-hero h2{font-size:21px; margin-bottom:6px}
.onboard-hero p{color:var(--ink-2); font-size:13.5px; max-width:560px}
.onboard-steps{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.onboard-step{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:18px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow-sm)}
.onboard-step.done{border-color:var(--good-dot); background:color-mix(in srgb, var(--good-bg) 55%, var(--surface))}
.onboard-step-top{display:flex; align-items:center; justify-content:space-between}
.onboard-num{width:26px; height:26px; border-radius:99px; background:var(--accent-soft); color:var(--accent-soft-ink); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex:0 0 auto}
.onboard-step.done .onboard-num{background:var(--good-bg); color:var(--good)}
.onboard-step h4{font-size:14px}
.onboard-step p{color:var(--ink-muted); font-size:12.5px; flex:1}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface)}
table{width:100%; border-collapse:collapse; min-width:640px}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); font-weight:700; padding:11px 11px; border-bottom:1px solid var(--border); background:var(--surface-2); white-space:nowrap}
td{padding:11px 11px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:middle}
th:first-child, td:first-child{padding-left:14px}
th:last-child, td:last-child{padding-right:14px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-hover)}
td.num{text-align:right}
.cell-title{font-weight:600}
.cell-sub{color:var(--ink-muted); font-size:12px; margin-top:1px}
.truncate-cell{max-width:220px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row-actions{display:flex; gap:6px; justify-content:flex-end}

/* ---------- badges / pills ---------- */
.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700; white-space:nowrap}
.badge .dot{width:6px; height:6px; border-radius:99px}
.st-good{background:var(--good-bg); color:var(--good)} .st-good .dot{background:var(--good-dot)}
.st-warning{background:var(--warning-bg); color:var(--warning)} .st-warning .dot{background:var(--warning-dot)}
.st-critical{background:var(--critical-bg); color:var(--critical)} .st-critical .dot{background:var(--critical-dot)}
.st-accent{background:var(--accent-soft); color:var(--accent-soft-ink)} .st-accent .dot{background:var(--accent)}
.st-neutral{background:var(--neutral-bg); color:var(--neutral-ink)} .st-neutral .dot{background:var(--neutral-ink)}
.avatar{width:28px; height:28px; border-radius:99px; background:var(--accent-soft); color:var(--accent-soft-ink); display:inline-flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; flex:0 0 auto}
.name-cell{display:flex; align-items:center; gap:9px}
.tag{display:inline-flex; align-items:center; color:var(--ink-2); font-size:12px; font-weight:500}

/* ---------- tabs ---------- */
.pill-tabs{display:inline-flex; background:var(--surface-2); border-radius:99px; padding:3px; gap:2px; margin-bottom:16px}
.pill-tabs button{border:none; background:none; padding:7px 15px; border-radius:99px; font-size:13px; font-weight:600; color:var(--ink-2); cursor:pointer}
.pill-tabs button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm)}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed; inset:0; background:rgba(10,12,30,.5); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:100; overflow-y:auto}
.modal{background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:560px; box-shadow:var(--shadow-md); margin-bottom:5vh}
.modal.modal-lg{max-width:720px}
.modal-header{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border)}
.modal-header h3{font-size:16.5px}
.modal-body{padding:20px; display:flex; flex-direction:column; gap:14px; max-height:65vh; overflow-y:auto}
.modal-footer{display:flex; justify-content:flex-end; gap:8px; padding:16px 20px; border-top:1px solid var(--border)}

/* ---------- toast ---------- */
.toast-root{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px; padding-bottom:env(safe-area-inset-bottom,0px)}
.toast{background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; box-shadow:var(--shadow-md); animation:toastin .18s ease}
.toast.err{background:var(--critical-dot)}
.toast.ok{background:var(--good-dot); color:#08210f}
@keyframes toastin{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

/* ---------- empty state ---------- */
.empty{padding:46px 20px; text-align:center; color:var(--ink-muted)}
.empty svg{width:34px; height:34px; margin-bottom:10px; opacity:.5}
.empty-title{color:var(--ink-2); font-weight:600; margin-bottom:3px; font-size:13.5px}

/* ---------- charts ---------- */
.chart-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:18px}
.chart-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px}
.chart-legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:12px}
.legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2)}
.legend-swatch{width:9px; height:9px; border-radius:3px; flex:0 0 auto}
.bar-row{display:grid; grid-template-columns:78px 1fr 64px; align-items:center; gap:10px; margin-bottom:9px}
.bar-row .lbl{font-size:12px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar-track{height:9px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.bar-fill{height:100%; border-radius:99px}
.bar-row .val{font-size:12.5px; font-weight:700; text-align:right}
.util-ring{position:relative; width:104px; height:104px; margin:0 auto}
.util-ring svg{transform:rotate(-90deg)}
.util-ring .center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.util-ring .center b{font-family:var(--font-display); font-size:19px}
.util-ring .center span{font-size:10px; color:var(--ink-muted)}

/* ---------- calendar ---------- */
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.cal-dow{font-size:10.5px; font-weight:700; text-align:center; color:var(--ink-muted); text-transform:uppercase; padding-bottom:4px}
.cal-cell{min-height:72px; border:1px solid var(--border); border-radius:9px; padding:6px; font-size:11.5px; background:var(--surface); display:flex; flex-direction:column; gap:3px; cursor:default}
.cal-cell.outside{opacity:.35}
.cal-cell.today{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset}
.cal-cell .d{font-weight:700; font-size:12px}
.cal-evt{font-size:10px; padding:1px 5px; border-radius:5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ---------- responsive ---------- */
@media (max-width: 980px){
  .grid-2,.grid-3{grid-template-columns:1fr}
  .onboard-steps{grid-template-columns:1fr}
}
@media (max-width: 860px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .backdrop.open{display:block}
  .main{margin-left:0}
  .menu-toggle{display:inline-flex}
  .view{padding:18px 16px 60px}
  .topbar{padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .field-row{grid-template-columns:1fr}
}
@media (max-width: 520px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}

.user-chip .name{font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1}
.user-chip button{background:none; border:0; color:var(--ink-muted); cursor:pointer; padding:2px; display:flex}
.user-chip button:hover{color:var(--critical)}

<script>
/* =========================================================================
   Locarion — protótipo funcional
   Dados vivem na capacidade "db" do artifact (compartilhados, persistentes).
   ========================================================================= */

const CATEGORIES = ["Betoneira","Andaime","Compactação","Geração de Energia","Ferramentas","Elevação","Eventos","Outro"];
const PAYMENT_METHODS = { pix:"Pix", boleto:"Boleto", cartao:"Cartão", dinheiro:"Dinheiro", transferencia:"Transferência" };
const EXPENSE_CATEGORIES = ["Manutenção","Logística","Seguro","Pessoal","Aluguel de sede","Marketing","Outro"];

const DEFAULT_CONTRACT_TEMPLATE = `CONTRATO DE LOCAÇÃO DE EQUIPAMENTOS Nº {{codigo}}

LOCADORA: {{empresa_nome}}, CNPJ {{empresa_cnpj}}, com sede em {{empresa_endereco}}, telefone {{empresa_telefone}}.
LOCATÁRIO: {{cliente_nome}}, CPF/CNPJ {{cliente_documento}}, telefone {{cliente_telefone}}, com endereço em {{cliente_endereco}}.

CLÁUSULA 1ª — DO OBJETO
O presente contrato tem por objeto a locação do(s) seguinte(s) equipamento(s), nas condições abaixo:
{{itens}}

CLÁUSULA 2ª — DO PRAZO
A locação terá início em {{data_inicio}} e devolução prevista para {{data_fim}}, totalizando {{dias}} dia(s).

CLÁUSULA 3ª — DO VALOR
O valor total da locação é de {{valor}}, a ser pago conforme condições acordadas entre as partes. Frete de entrega/retirada: {{frete}}.

CLÁUSULA 4ª — DO LOCAL DE USO
O(s) equipamento(s) será(ão) utilizado(s) em: {{local}}.

CLÁUSULA 5ª — DAS OBRIGAÇÕES DO LOCATÁRIO
O LOCATÁRIO se compromete a: (a) utilizar o(s) equipamento(s) de forma adequada e conforme sua finalidade; (b) zelar pela conservação e segurança do(s) bem(ns); (c) não sublocar, ceder ou emprestar o(s) equipamento(s) a terceiros sem autorização prévia da LOCADORA; (d) devolver o(s) equipamento(s) na data prevista, nas mesmas condições em que foi(ram) recebido(s), ressalvado o desgaste natural de uso.

CLÁUSULA 6ª — DA MANUTENÇÃO E AVARIAS
Danos causados por mau uso, negligência ou imperícia serão de responsabilidade do LOCATÁRIO, que arcará com os custos de reparo ou reposição.

CLÁUSULA 7ª — DO ATRASO NA DEVOLUÇÃO
Em caso de atraso na devolução, será cobrada multa de {{multa_atraso}} ao dia sobre o valor da locação, além de diária adicional proporcional, sem prejuízo de eventuais perdas e danos.

CLÁUSULA 8ª — DO FORO
Fica eleito o foro da comarca da LOCADORA para dirimir quaisquer dúvidas oriundas deste contrato.

E por estarem justas e contratadas, as partes assinam o presente instrumento.

{{local}}, {{data_hoje}}.


_______________________________________
{{empresa_nome}} (LOCADORA)


_______________________________________
{{cliente_nome}} (LOCATÁRIO)`;

const STATE = { equipment:[], clients:[], contracts:[], maintenance:[], payments:[], expenses:[], company:{name:"Locarion", plan:"profissional", contractTemplate:DEFAULT_CONTRACT_TEMPLATE} };
const LOADED = { equipment:false, clients:false, contracts:false, maintenance:false, payments:false, expenses:false, company:false };
const FILTERS = {
  equipamentos:{ q:"", status:"todos", cat:"todos", kind:"equipamento" },
  contratos:{ q:"", status:"todos", selected:[] },
  clientes:{ q:"" },
  manutencao:{ q:"", status:"todos" },
  financeiro:{ tab:"faturas", payStatus:"todos" },
  localizar:{ q:"" },
  config:{ tab:"geral" },
  contaspr:{ month: null },
  historico:{ tab:"linha", q:"", from:"", to:"" },
  orcamentos:{ tab:"propostas" },
  receitas:{ months:6 },
};
function downloadBlob(filename, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
let CAL_MONTH = new Date();
let FIN_UNLOCKED = false; /* módulo Financeiro protegido por senha (opcional) — desbloqueio vale só para esta sessão */
let FIN_HIDDEN = false; /* oculta valores sensíveis do Financeiro na tela (útil com alguém por perto) — não persiste */
function moneyMasked(n){ return FIN_HIDDEN ? "R$ ••••" : fmtMoney(n); }

/* ---------------- utils ---------------- */
function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : "id-"+Date.now()+"-"+Math.random().toString(16).slice(2)); }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function isoAddDays(iso, n){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function daysBetween(a,b){ return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000); }
function fmtMoney(n){ n = Number(n)||0; return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("pt-BR"); }
function fmtDateLong(iso){ if(!iso) return "—"; const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}); }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(name){ if(!name) return "?"; const p=name.trim().split(/\s+/); return ((p[0]?.[0]||"")+(p.length>1?p[p.length-1][0]:"")).toUpperCase(); }
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
function maskCep(v){ return (v||"").replace(/\D/g,"").slice(0,8).replace(/^(\d{5})(\d)/,"$1-$2"); }
async function lookupCep(cepInputEl, addressInputEl, hintEl){
  const digits = (cepInputEl.value||"").replace(/\D/g,"");
  if(digits.length !== 8){ if(hintEl) hintEl.textContent = digits.length ? "CEP incompleto." : ""; return; }
  if(hintEl) hintEl.textContent = "Buscando endereço…";
  try{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), 5000);
    const res = await fetch(`https://viacep.com.br/ws/${digits}/json/`, { signal: ctrl.signal });
    clearTimeout(t);
    const data = await res.json();
    if(data.erro){ if(hintEl) hintEl.textContent = "CEP não encontrado — preencha manualmente."; return; }
    const parts = [data.logradouro, data.bairro, data.localidade && data.uf ? `${data.localidade}/${data.uf}` : (data.localidade||data.uf||"")].filter(Boolean);
    if(addressInputEl && parts.length) addressInputEl.value = parts.join(", ");
    if(hintEl) hintEl.textContent = "Endereço preenchido — complete o número/complemento se necessário.";
  }catch(err){
    if(hintEl) hintEl.textContent = "Não foi possível buscar o CEP agora — preencha manualmente.";
  }
}
function monthKey(iso){ return iso.slice(0,7); }
function monthLabel(key){ const [y,m]=key.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString("pt-BR",{month:"short"}).replace(".","") ; }

function byId(list, id){ return list.find(x=>x.id===id); }
function clientName(id){ return byId(STATE.clients,id)?.name || "Cliente removido"; }
function equipmentName(id){ return byId(STATE.equipment,id)?.name || "Equipamento removido"; }
/* Agrupa ids repetidos (itens de estoque com quantidade > 1) em "Nome ×N" para exibição. */
function equipmentNamesSummary(ids){
  const counts = {};
  (ids||[]).forEach(id=>{ counts[id] = (counts[id]||0)+1; });
  return Object.entries(counts).map(([id,n])=> n>1 ? `${equipmentName(id)} ×${n}` : equipmentName(id)).join(", ");
}
function isEquipKind(e){ return (e.kind||"equipamento")==="equipamento"; }
function fleetOnly(list){ return list.filter(isEquipKind); }

/* ---------------- status computation ---------------- */
function equipmentStatusMeta(status){
  return { disponivel:{label:"Disponível",cls:"st-good"}, alugado:{label:"Alugado",cls:"st-accent"}, manutencao:{label:"Manutenção",cls:"st-warning"} }[status] || {label:status,cls:"st-neutral"};
}
function contractComputedStatus(c){
  if(c.status==="orcamento") return "orcamento";
  if(c.status==="cancelado") return "cancelado";
  if(c.returnedDate) return "devolvido";
  const today = todayISO();
  if(c.startDate > today) return "agendado";
  if(c.endDate < today) return "atrasado";
  if(c.endDate === today) return "vencendo_hoje";
  return "ativo";
}
function contractStatusMeta(status){
  return {
    orcamento:{label:"Orçamento",cls:"st-neutral"},
    agendado:{label:"Agendado",cls:"st-accent"},
    ativo:{label:"Ativo",cls:"st-good"},
    vencendo_hoje:{label:"Vencendo hoje",cls:"st-warning"},
    atrasado:{label:"Atrasado",cls:"st-critical"},
    devolvido:{label:"Devolvido",cls:"st-neutral"},
    cancelado:{label:"Cancelado",cls:"st-neutral"},
  }[status] || {label:status,cls:"st-neutral"};
}
function paymentComputedStatus(p){
  if(p.paidDate) return "pago";
  if(p.dueDate < todayISO()) return "atrasado";
  return "pendente";
}
function paymentStatusMeta(s){
  return { pago:{label:"Pago",cls:"st-good"}, pendente:{label:"Pendente",cls:"st-warning"}, atrasado:{label:"Atrasado",cls:"st-critical"} }[s] || {label:s,cls:"st-neutral"};
}
function expenseComputedStatus(e){ return e.paidDate ? "pago" : (e.dueDate && e.dueDate < todayISO() ? "atrasado" : "pendente"); }
function maintenanceComputedStatus(m){
  if(m.completedDate) return "concluida";
  if(m.scheduledDate < todayISO()) return "atrasada";
  return "agendada";
}
function maintenanceStatusMeta(s){
  return { concluida:{label:"Concluída",cls:"st-good"}, atrasada:{label:"Atrasada",cls:"st-critical"}, agendada:{label:"Agendada",cls:"st-accent"} }[s] || {label:s,cls:"st-neutral"};
}
function activeContractForEquipment(eqId){
  return STATE.contracts.find(c => (c.equipmentIds||[]).includes(eqId) && ["ativo","vencendo_hoje","atrasado"].includes(contractComputedStatus(c)));
}

/* ---------------- toast ---------------- */
function toast(msg, kind){
  const root = $("#toast-root");
  const el = document.createElement("div");
  el.className = "toast" + (kind==="err"?" err":kind==="ok"?" ok":"");
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .25s"; setTimeout(()=>el.remove(),250); }, 2600);
}

/* ---------------- modal ---------------- */
function openModal(title, bodyHtml, footerHtml, opts){
  opts = opts || {};
  const root = $("#modal-root");
  root.innerHTML = `

/* Reúne pendências que exigem atenção: contratos atrasados/vencendo, pagamentos e despesas
   atrasados e manutenções atrasadas. Usado no sino do topo e no card do Dashboard. */
function computeAlerts(){
  if(!allLoaded()) return [];
  const out = [];
  const today = todayISO();
  STATE.contracts.forEach(c=>{
    const st = contractComputedStatus(c);
    if(st==="atrasado"){
      out.push({sev:"critical", text:`Contrato ${escapeHtml(c.code||"")} atrasado`, sub:`${escapeHtml(clientName(c.clientId))} · devolução prevista ${fmtDate(c.endDate)}`, open:()=>contractFormModal(c.id)});
    } else if(st==="vencendo_hoje"){
      out.push({sev:"warning", text:`Contrato ${escapeHtml(c.code||"")} vence hoje`, sub:escapeHtml(clientName(c.clientId)), open:()=>contractFormModal(c.id)});
    } else if(st==="ativo"){
      const d = daysBetween(today, c.endDate);
      if(d>0 && d<=2) out.push({sev:"warning", text:`Contrato ${escapeHtml(c.code||"")} vence em ${d} dia(s)`, sub:escapeHtml(clientName(c.clientId)), open:()=>contractFormModal(c.id)});
    }
  });
  STATE.payments.forEach(p=>{
    if(paymentComputedStatus(p)==="atrasado"){
      out.push({sev:"critical", text:`Pagamento atrasado — ${escapeHtml(clientName(p.clientId))}`, sub:`${fmtMoney(p.amount)} · venceu em ${fmtDate(p.dueDate)}`, open:()=>{ location.hash="#/financeiro"; }});
    }
  });
  STATE.expenses.forEach(e=>{
    if(expenseComputedStatus(e)==="atrasado"){
      out.push({sev:"critical", text:`Despesa atrasada — ${escapeHtml(e.description||"")}`, sub:`${fmtMoney(e.amount)}`, open:()=>{ location.hash="#/contaspr"; }});
    }
  });
  STATE.maintenance.forEach(m=>{
    if(maintenanceComputedStatus(m)==="atrasada"){
      out.push({sev:"warning", text:`Manutenção atrasada — ${escapeHtml(equipmentName(m.equipmentId))}`, sub:`prevista para ${fmtDate(m.scheduledDate)}`, open:()=>{ location.hash="#/manutencao"; }});
    }
  });
  out.sort((a,b)=> (a.sev==="critical"?0:1) - (b.sev==="critical"?0:1));
  return out;
}
function updateAlertsBadge(){
  const badge = $("#alerts-badge");
  if(!badge) return;
  if(!allLoaded()){ badge.style.display="none"; return; }
  const n = computeAlerts().length;
  if(n>0){ badge.style.display="block"; badge.textContent = n>9?"9+":String(n); }
  else badge.style.display="none";
}

/* ---------------- chart helpers (inline SVG) ---------------- */
function donutChart(data, size){
  // data: [{label, value, color}]
  size = size || 148;
  const r = size/2 - 14, cx = size/2, cy = size/2, circ = 2*Math.PI*r;
  const total = data.reduce((s,d)=>s+d.value,0) || 1;
  let offset = 0;
  const segs = data.map(d=>{
    const frac = d.value/total;
    const len = Math.max(frac*circ - 2, 0); // 2px surface gap between segments
    const dash = `${len} ${circ-len}`;
    const rot = (offset/total)*360;
    offset += d.value;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="15" stroke-dasharray="${dash}" stroke-dashoffset="0" transform="rotate(${rot-90} ${cx} ${cy})" stroke-linecap="round"><title>${escapeHtml(d.label)}: ${d.value}</title></circle>`;
  }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="15"/>
    ${segs}
  </svg>`;
}
function barMini(data, opts){
  // horizontal bar rows: data [{label,value,color}]
  opts = opts||{};
  const max = Math.max(...data.map(d=>d.value), 1);
  return data.map(d=>`
    <div class="bar-row">
      <div class="lbl">${escapeHtml(d.label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max((d.value/max)*100,d.value>0?3:0)}%;background:${d.color}"></div></div>
      <div class="val tabular">${opts.money ? fmtMoney(d.value) : d.value}</div>
    </div>`).join("");
}
function columnChart(data, opts){
  // vertical grouped columns: data [{label, series:[{value,color,name}]}]
  opts = opts || {};
  const w = 560, h = 190, padL = 40, padB = 26, padT = 10;
  const plotW = w - padL - 12, plotH = h - padB - padT;
  const maxV = Math.max(1, ...data.flatMap(d=>d.series.map(s=>s.value)));
  const groupW = plotW / data.length;
  const seriesCount = data[0]?.series.length || 1;
  const gap = 6;
  const barW = Math.max(6, (groupW - gap*2) / seriesCount);
  let bars = "", labels = "";
  data.forEach((d,i)=>{
    const gx = padL + i*groupW;
    d.series.forEach((s,j)=>{
      const bh = (s.value/maxV) * plotH;
      const bx = gx + gap/2 + j*barW;
      const by = padT + plotH - bh;
      bars += `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${(barW-3).toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" rx="3" fill="${s.color}"><title>${escapeHtml(s.name||d.label)}: ${opts.money?fmtMoney(s.value):s.value}</title></rect>`;
    });
    labels += `<text x="${(gx+groupW/2).toFixed(1)}" y="${h-8}" font-size="10.5" text-anchor="middle" fill="var(--ink-muted)">${escapeHtml(d.label)}</text>`;
  });
  // gridlines (3)
  let grid = "";
  for(let g=0; g<=2; g++){
    const gy = padT + plotH - (g/2)*plotH;
    grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${w-8}" y2="${gy.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
    grid += `<text x="2" y="${(gy+3).toFixed(1)}" font-size="9.5" fill="var(--ink-muted)">${opts.money? fmtCompact((maxV/2)*g) : Math.round((maxV/2)*g)}</text>`;
  }
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMinYMin meet" style="overflow:visible">${grid}${bars}${labels}</svg>`;
}
function fmtCompact(n){ if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,"")+"k"; return String(Math.round(n)); }
function utilizationRing(pct, size){
  size = size||104; const r = size/2-9, cx=size/2, cy=size/2, circ=2*Math.PI*r;
  const len = Math.max(circ*(pct/100)-2,0);
  return `<div class="util-ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="9"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${len} ${circ-len}"/>
    </svg>
    <div class="center"><b>${Math.round(pct)}%</b><span>em uso</span></div>
  </div>`;
}
function chartLegend(items){
  return `<div class="chart-legend">${items.map(i=>`<div class="legend-item"><span class="legend-swatch" style="background:${i.color}"></span>${escapeHtml(i.label)}</div>`).join("")}</div>`;
}

function renderClientsOpenInvoicesTable(){
  const byClient = {};
  STATE.payments.filter(p=>paymentComputedStatus(p)!=="pago").forEach(p=>{
    byClient[p.clientId] = byClient[p.clientId] || {sum:0,count:0,overdue:false};
    byClient[p.clientId].sum += Number(p.amount||0);
    byClient[p.clientId].count += 1;
    if(paymentComputedStatus(p)==="atrasado") byClient[p.clientId].overdue = true;
  });
  const rows = Object.entries(byClient).sort((a,b)=>b[1].sum-a[1].sum);
  if(!rows.length) return `<div class="empty"><div class="empty-title">Nenhuma fatura em aberto</div><div class="hint">Todos os clientes estão em dia.</div></div>`;
  return `<div class="table-wrap" style="border:none;border-radius:0"><table><thead><tr><th>Cliente</th><th>Faturas</th><th class="num">Valor em aberto</th><th>Situação</th></tr></thead><tbody>
    ${rows.map(([cid,v])=>`<tr><td><div class="name-cell"><div class="avatar">${initials(clientName(cid))}</div>${escapeHtml(clientName(cid))}</div></td><td>${v.count}</td><td class="num tabular">${fmtMoney(v.sum)}</td><td>${v.overdue?'<span class="badge st-critical"><span class="dot"></span>Atrasado</span>':'<span class="badge st-warning"><span class="dot"></span>Pendente</span>'}</td></tr>`).join("")}
  </tbody></table></div>`;
}

function equipmentRateSummary(e){
  const tiers = [e.dailyRate?`${fmtMoney(e.dailyRate)}/dia`:null, e.weeklyRate?`${fmtMoney(e.weeklyRate)}/sem`:null, e.monthlyRate?`${fmtMoney(e.monthlyRate)}/mês`:null].filter(Boolean);
  return tiers.length ? tiers.join(" · ") : fmtMoney(e.dailyRate);
}
function renderEquipTable(){
  const f = FILTERS.equipamentos;
  let list = STATE.equipment.filter(e=>{
    if((e.kind||"equipamento")!==f.kind) return false;
    if(f.kind==="equipamento" && f.status!=="todos" && e.status!==f.status) return false;
    if(f.cat!=="todos" && e.category!==f.cat) return false;
    if(f.q && !(e.name+" "+e.code).toLowerCase().includes(f.q.toLowerCase())) return false;
    return true;
  }).sort((a,b)=>a.name.localeCompare(b.name));
  const wrap = $("#eq-table-wrap");
  if(!list.length){ wrap.innerHTML = emptyState(f.kind==='servico'?"Nenhum serviço encontrado":"Nenhum equipamento encontrado","Ajuste os filtros ou cadastre um novo item."); return; }
  wrap.innerHTML = `<div class="table-wrap"><table><thead><tr><th>${f.kind==='servico'?'Serviço':'Equipamento'}</th><th>Categoria</th><th class="num">Tarifas</th>${f.kind==='equipamento'?'<th>Status</th><th>Localização atual</th>':''}<th></th></tr></thead><tbody>
    ${list.map(e=>{
      const stock = isStockMode(e);
      const meta = equipmentStatusMeta(e.status);
      const ac = (!stock && e.status==="alugado") ? activeContractForEquipment(e.id) : null;
      const loc = stock ? "—" : (ac ? `${escapeHtml(clientName(ac.clientId))} · ${escapeHtml(ac.location||"—")}` : (e.status==="manutencao" ? "Em oficina" : "—"));
      return `<tr>
        <td><div class="cell-title">${escapeHtml(e.name)}</div><div class="cell-sub">${escapeHtml(e.code||"")}</div></td>
        <td><span class="tag">${escapeHtml(e.category)}</span></td>

        ${f.kind==='equipamento' ? `<td>${stock ? `<span class="badge st-accent"><span class="dot"></span>${equipStockAvailable(e)}/${e.stockQty||0} em estoque</span>` : `<span class="badge ${meta.cls}"><span class="dot"></span>${meta.label}</span>`}</td><td class="cell-sub">${loc}</td>` : ""}

        </div></td>
      </tr>`;
    }).join("")}
  </tbody></table></div>`;
}

function isStockMode(e){ return isEquipKind(e) && (e.trackMode||"unidade")==="estoque"; }
function equipStockInUse(eq){
  return STATE.contracts.filter(c=> ["ativo","vencendo_hoje","atrasado"].includes(contractComputedStatus(c)))
    .reduce((sum,c)=> sum + (c.equipmentIds||[]).filter(x=>x===eq.id).length, 0);
}
function equipStockAvailable(eq){ return Math.max((eq.stockQty||0) - equipStockInUse(eq), 0); }
/* Escolhe a melhor tarifa cadastrada para o número de dias locados (mensal > quinzenal > semanal > diária). */
function bestRateForDays(eq, days){
  if(days>=28 && eq.monthlyRate) return { total: eq.monthlyRate * Math.ceil(days/30), label:"mensal" };
  if(days>=14 && eq.biweeklyRate) return { total: eq.biweeklyRate * Math.ceil(days/15), label:"quinzenal" };
  if(days>=7 && eq.weeklyRate) return { total: eq.weeklyRate * Math.ceil(days/7), label:"semanal" };
  return { total: (eq.dailyRate||0) * days, label:"diária" };
}
function equipmentHistoryModal(id){
  const eq = byId(STATE.equipment,id);
  const contracts = STATE.contracts.filter(c=>(c.equipmentIds||[]).includes(id)).sort((a,b)=>b.startDate.localeCompare(a.startDate));
  const maint = STATE.maintenance.filter(m=>m.equipmentId===id).sort((a,b)=>b.scheduledDate.localeCompare(a.scheduledDate));
  const maintCostTotal = maint.reduce((s,m)=>s+Number(m.cost||0),0);
  const nextDue = eq && eq.maintenanceIntervalMonths ? suggestedPreventiveMaintenance().find(s=>s.equipment.id===id) : null;
  openModal(`Histórico · ${eq?.name||""}`, `
    <div>
      <h4 style="font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);margin-bottom:8px">Contratos</h4>
      ${contracts.length? contracts.map(c=>{ const m=contractStatusMeta(contractComputedStatus(c)); return `<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px"><span>${escapeHtml(clientName(c.clientId))} · ${fmtDate(c.startDate)}–${fmtDate(c.endDate)}</span><span class="badge ${m.cls}"><span class="dot"></span>${m.label}</span></div>`; }).join("") : `<p class="hint">Nenhum contrato registrado.</p>`}
    </div>
    <div>
      <h4 style="font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);margin:14px 0 8px">Manutenção</h4>
      ${nextDue? `<p class="hint" style="margin-bottom:6px">Próxima manutenção prevista: <b style="color:var(--ink)">${fmtDate(nextDue.due)}</b>${nextDue.overdue?' <span class="badge st-critical"><span class="dot"></span>Vencida</span>':''}</p>` : ""}
      ${maint.length? maint.map(m=>{ const s=maintenanceStatusMeta(maintenanceComputedStatus(m)); return `<div style="display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px"><span>${escapeHtml(m.type==='preventiva'?'Preventiva':'Corretiva')} · ${fmtDate(m.scheduledDate)}${m.provider?` · ${escapeHtml(m.provider)}`:''}</span><span style="display:flex;align-items:center;gap:8px;flex:none">${m.cost?`<span class="tabular hint">${fmtMoney(m.cost)}</span>`:''}<span class="badge ${s.cls}"><span class="dot"></span>${s.label}</span></span></div>`; }).join("") : `<p class="hint">Nenhuma manutenção registrada.</p>`}
      ${maintCostTotal>0? `<p class="hint" style="margin-top:8px">Custo total em manutenções: <b class="tabular" style="color:var(--ink)">${fmtMoney(maintCostTotal)}</b></p>` : ""}
    </div>
  `, `<button class="btn btn-secondary" data-action="close-modal">Fechar</button>`, {large:true});
}

/* ======================= CONTRATOS ======================= */
function renderContratos(){
  setTopbarActions(`<button class="btn btn-primary" data-action="new-contract"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Novo contrato</button>`);
  const view = $("#view");
  if(!allLoaded()){ view.innerHTML = loadingView(); return; }
  const f = FILTERS.contratos;
  view.innerHTML = `
    <div class="filters-row">
      <div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input class="input" id="ct-search" placeholder="Buscar por cliente ou código…" value="${escapeHtml(f.q)}"></div>
      <select class="select" id="ct-status" style="width:auto">
        <option value="todos">Todos os status</option>
        <option value="orcamento">Orçamento</option>
        <option value="agendado">Agendado</option>
        <option value="ativo">Ativo</option>
        <option value="vencendo_hoje">Vencendo hoje</option>
        <option value="atrasado">Atrasado</option>
        <option value="devolvido">Devolvido</option>
        <option value="cancelado">Cancelado</option>
      </select>
    </div>
    <div id="ct-table-wrap"></div>
  `;
  $("#ct-status").value = f.status;
  $("#ct-search").addEventListener("input", debounce(e=>{ f.q=e.target.value; renderContractsTable(); },150));
  $("#ct-status").addEventListener("change", e=>{ f.status=e.target.value; renderContractsTable(); });
  renderContractsTable();
}
function renderContractsTable(){
  const f = FILTERS.contratos;
  let list = STATE.contracts.filter(c=>{
    const st = contractComputedStatus(c);
    if(f.status!=="todos" && st!==f.status) return false;
    if(f.q){ const hay=(c.code+" "+clientName(c.clientId)).toLowerCase(); if(!hay.includes(f.q.toLowerCase())) return false; }
    return true;
  }).sort((a,b)=>b.startDate.localeCompare(a.startDate));
  const wrap = $("#ct-table-wrap");
  if(!list.length){ wrap.innerHTML = emptyState("Nenhum contrato encontrado","Ajuste os filtros ou crie um novo contrato."); return; }
  f.selected = f.selected.filter(id => list.some(c=>c.id===id));
  const allChecked = list.length>0 && list.every(c=>f.selected.includes(c.id));
  wrap.innerHTML = `
    ${f.selected.length ? `<div class="card card-pad" style="margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg-2)">
      <span style="font-size:13px;font-weight:500">${f.selected.length} contrato(s) selecionado(s)</span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary btn-sm" id="ct-bulk-clear" type="button">Limpar seleção</button>
        <button class="btn btn-sm" style="background:var(--critical-dot);color:#fff" id="ct-bulk-delete" type="button">Excluir selecionados</button>
      </div>
    </div>` : ""}
    <div class="table-wrap"><table><thead><tr><th style="width:34px"><input type="checkbox" id="ct-check-all" ${allChecked?"checked":""}></th><th>Código</th><th>Cliente</th><th>Equipamento(s)</th><th>Início</th><th>Devolução</th><th>Status</th><th class="num">Valor</th><th></th></tr></thead><tbody>
    ${list.map(c=>{
      const meta = contractStatusMeta(contractComputedStatus(c));
      const st = contractComputedStatus(c);
      return `<tr>
        <td><input type="checkbox" class="ct-row-check" data-id="${c.id}" ${f.selected.includes(c.id)?"checked":""}></td>
        <td class="cell-title tabular">${escapeHtml(c.code)}</td>
        <td>${escapeHtml(clientName(c.clientId))}</td>
        <td class="cell-sub truncate-cell" title="${escapeHtml(equipmentNamesSummary(c.equipmentIds))}">${escapeHtml(equipmentNamesSummary(c.equipmentIds))}</td>
        <td class="tabular">${fmtDate(c.startDate)}</td>
        <td class="tabular">${fmtDate(c.endDate)}</td>
        <td><span class="badge ${meta.cls}"><span class="dot"></span>${meta.label}</span></td>
        <td class="num tabular">${fmtMoney(c.value)}</td>
        <td><div class="row-actions">
          ${(st==="ativo"||st==="vencendo_hoje"||st==="atrasado") ? `<button class="icon-btn" title="Registrar devolução" data-action="return-contract" data-id="${c.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg></button>` : ""}
          <button class="icon-btn" title="Gerar contrato" data-action="gen-contract-doc" data-id="${c.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg></button>
          <button class="icon-btn" title="Ver / editar" data-action="edit-contract" data-id="${c.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button class="icon-btn" title="Excluir" data-action="delete-contract" data-id="${c.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
        </div></td>
      </tr>`;
    }).join("")}
  </tbody></table></div>`;
  $("#ct-check-all").addEventListener("change", e=>{
    f.selected = e.target.checked ? list.map(c=>c.id) : [];
    renderContractsTable();
  });
  $all(".ct-row-check").forEach(cb=> cb.addEventListener("change", e=>{
    const id = e.target.dataset.id;
    if(e.target.checked){ if(!f.selected.includes(id)) f.selected.push(id); }
    else{ f.selected = f.selected.filter(x=>x!==id); }
    renderContractsTable();
  }));
  if($("#ct-bulk-clear")) $("#ct-bulk-clear").addEventListener("click", ()=>{ f.selected=[]; renderContractsTable(); });
  if($("#ct-bulk-delete")) $("#ct-bulk-delete").addEventListener("click", ()=>{
    const n = f.selected.length;
    confirmDialog(`Excluir ${n} contrato(s) selecionado(s)? Essa ação não pode ser desfeita.`, async ()=>{
      const ids = [...f.selected];
      for(const id of ids){ await deleteDoc("contracts", id); }
      f.selected = [];
      toast(`${n} contrato(s) excluído(s).`,"ok");
      renderContractsTable();
    });
  });
}
function clientLocationOptions(clientId){
  const cl = clientId ? byId(STATE.clients, clientId) : null;
  return cl?.deliveryLocations || [];
}
function contractFormModal(id, presetStatus, cloneFrom){
  const c = id ? byId(STATE.contracts,id) : null;
  const pre = c || cloneFrom || null;
  const availEquip = STATE.equipment.filter(e=> isEquipKind(e) && (e.status==="disponivel" || (c && (c.equipmentIds||[]).includes(e.id))));
  const availServ = STATE.equipment.filter(e=> !isEquipKind(e));
  const selectedIds = new Set(pre?.equipmentIds||[]);
  const selectedQty = {};
  (pre?.equipmentIds||[]).forEach(eid=>{ selectedQty[eid] = (selectedQty[eid]||0)+1; });
  const itemDates = pre?.itemDates || {};
  const dateToggleBtn = (eqId)=> `<button type="button" class="icon-btn item-date-toggle${itemDates[eqId]?" active":""}" data-eq="${eqId}" title="Usar datas diferentes para este item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button>`;
  const dateFieldsRow = (eqId)=>{ const ov=itemDates[eqId]; return `<div class="field-row item-date-fields" data-eq-dates="${eqId}" style="display:${ov?"flex":"none"};padding:2px 6px 8px 6px;gap:6px;align-items:center">
    <span class="hint">Datas deste item:</span>
    <input type="date" class="input item-date-start" data-eq="${eqId}" value="${ov?.start||""}" style="font-size:12px;padding:5px 8px">
    <span class="hint">até</span>
    <input type="date" class="input item-date-end" data-eq="${eqId}" value="${ov?.end||""}" style="font-size:12px;padding:5px 8px">
  </div>`; };
  const defaultStatus = c?.status || presetStatus || "ativo";
  openModal(c?`Contrato ${c.code}`:(cloneFrom?`Novo contrato (a partir de ${escapeHtml(cloneFrom.code||"")})`:(presetStatus==="orcamento"?"Novo orçamento":"Novo contrato")), `
    ${cloneFrom? `<p class="hint" style="margin:-2px 0 10px">Duplicado do contrato ${escapeHtml(cloneFrom.code||"")}. Revise cliente, itens e datas antes de criar.</p>` : ""}
    <div class="field-row">
      <div class="field"><label>Cliente</label><select class="select" id="f-client">${STATE.clients.map(cl=>`<option value="${cl.id}" ${pre?.clientId===cl.id?"selected":""}>${escapeHtml(cl.name)}</option>`).join("") || '<option value="">Cadastre um cliente primeiro</option>'}</select></div>
      <div class="field"><label>Status</label><select class="select" id="f-status">
        <option value="orcamento" ${defaultStatus==="orcamento"?"selected":""}>Orçamento</option>
        <option value="agendado" ${defaultStatus==="agendado"?"selected":""}>Agendado</option>
        <option value="ativo" ${defaultStatus==="ativo"?"selected":""}>Ativo</option>
        ${c?.status==="devolvido"?`<option value="devolvido" selected>Devolvido</option>`:""}
        ${c?`<option value="cancelado" ${c.status==="cancelado"?"selected":""}>Cancelado</option>`:""}
      </select></div>
    </div>
    <div class="field"><label>Equipamentos</label><p class="hint" style="margin:-2px 0 6px">Use o ícone de calendário para dar a um item datas de entrega/devolução diferentes do contrato — afeta o valor calculado e o texto do contrato. A disponibilidade do equipamento continua controlada pela data geral do contrato.</p><div class="checklist" id="f-equip" style="max-height:280px">
      ${availEquip.length? availEquip.map(e=>{
        if(isStockMode(e)){
          const already = selectedQty[e.id]||0;
          const max = equipStockAvailable(e) + already;
          return `<div data-eq-row="${e.id}"><label style="display:flex;align-items:center;gap:8px"><span style="flex:1">${escapeHtml(e.name)} <span class="hint">· ${equipmentRateSummary(e)} · ${equipStockAvailable(e)}/${e.stockQty||0} em estoque</span></span><input type="number" class="input qty-input" data-eq="${e.id}" min="0" max="${max}" value="${Math.min(already,max)}" style="width:70px">${dateToggleBtn(e.id)}</label>${dateFieldsRow(e.id)}</div>`;
        }
        return `<div data-eq-row="${e.id}"><label><input type="checkbox" value="${e.id}" ${selectedIds.has(e.id)?"checked":""}> <span style="flex:1">${escapeHtml(e.name)} <span class="hint">· ${equipmentRateSummary(e)}</span></span>${dateToggleBtn(e.id)}</label>${dateFieldsRow(e.id)}</div>`;
      }).join("") : '<p class="hint" style="padding:6px">Nenhum equipamento disponível no momento.</p>'}
    </div></div>
    ${availServ.length? `<div class="field"><label>Serviços adicionais</label><div class="checklist" id="f-serv">
      ${availServ.map(e=>`<label><input type="checkbox" value="${e.id}" ${selectedIds.has(e.id)?"checked":""}> ${escapeHtml(e.name)} <span class="hint">· ${fmtMoney(e.dailyRate)}</span></label>`).join("")}
    </div></div>` : ""}
    <div class="field-row">
      <div class="field"><label>Data de início</label><input class="input" type="date" id="f-start" value="${pre?.startDate||todayISO()}"></div>
      <div class="field"><label>Devolução prevista</label><input class="input" type="date" id="f-end" value="${pre?.endDate||isoAddDays(todayISO(),3)}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Valor total (R$)</label><input class="input" type="number" min="0" step="0.01" id="f-value" value="${pre?.value??""}" placeholder="Calculado automaticamente"></div>
      <div class="field"><label>Local de entrega</label>
        <select class="select" id="f-loc-picker" style="margin-bottom:6px"><option value="">Endereço personalizado…</option></select>
        <input class="input" id="f-loc" value="${escapeHtml(pre?.location||"")}" placeholder="Endereço da obra ou evento">
      </div>
    </div>
    <div class="field">
      <label style="display:flex;align-items:center;gap:7px;font-weight:500"><input type="checkbox" id="f-freight-on" ${pre?.freight?"checked":""}> Cobrar frete</label>
      <p class="hint" style="margin:2px 0 6px">Linha separada na fatura inicial — não é incorporado ao valor dos equipamentos.</p>
      <input class="input" type="number" min="0" step="0.01" id="f-freight" value="${pre?.freight??""}" placeholder="Valor do frete (R$)" style="display:${pre?.freight?"block":"none"};max-width:220px">
    </div>
    <div class="field"><label>Observações</label><textarea class="textarea" id="f-notes">${escapeHtml(pre?.notes||"")}</textarea></div>
    <div class="field"><label style="display:flex;align-items:center;gap:7px;font-weight:500"><input type="checkbox" id="f-signed" ${c?.signed?"checked":""}> Contrato assinado</label></div>
  `, `${c?`<button class="btn btn-secondary" id="duplicate-contract" style="margin-right:auto">Duplicar</button>`:""}<button class="btn btn-secondary" data-action="close-modal">Cancelar</button><button class="btn btn-primary" id="save-contract">${c?"Salvar":"Criar contrato"}</button>`,
  { large:true, onMount(){
      $("#f-freight-on").addEventListener("change", ()=>{ $("#f-freight").style.display = $("#f-freight-on").checked ? "block" : "none"; });
      function itemDays(eqId, fallbackDays){
        const df = $(`.item-date-fields[data-eq-dates="${eqId}"]`);
        if(df && df.style.display!=="none"){
          const s = df.querySelector(".item-date-start").value, e = df.querySelector(".item-date-end").value;
          if(s && e && e>=s) return Math.max(daysBetween(s,e),1);
        }
        return fallbackDays;
      }
      function recalc(){
        const start=$("#f-start").value, end=$("#f-end").value;
        const days = Math.max(daysBetween(start,end),1);
        let total = 0;
        $all("#f-equip input[type=checkbox]:checked").forEach(i=>{ const eq=byId(STATE.equipment,i.value); if(eq) total += bestRateForDays(eq,itemDays(i.value,days)).total; });
        $all("#f-equip .qty-input").forEach(i=>{ const qty=Number(i.value)||0; if(!qty) return; const eq=byId(STATE.equipment,i.dataset.eq); if(eq) total += bestRateForDays(eq,itemDays(i.dataset.eq,days)).total * qty; });
        if($("#f-serv")) $all("#f-serv input:checked").forEach(i=>{ const eq=byId(STATE.equipment,i.value); if(eq) total += Number(eq.dailyRate||0); });
        if(!$("#f-value").dataset.touched) $("#f-value").value = total.toFixed(2);
      }
      function refreshLocPicker(){
        const locs = clientLocationOptions($("#f-client").value);
        const picker = $("#f-loc-picker");
        picker.innerHTML = `<option value="">Endereço personalizado…</option>` + locs.map(l=>`<option value="${escapeHtml(l.id)}">${escapeHtml(l.label)} — ${escapeHtml(l.address)}</option>`).join("");
      }
      $("#f-start").addEventListener("change", recalc);
      $("#f-end").addEventListener("change", recalc);
      $all("#f-equip input[type=checkbox]").forEach(i=>i.addEventListener("change", ()=>{
        if(!i.checked){
          const df = $(`.item-date-fields[data-eq-dates="${i.value}"]`);
          const btn = $(`.item-date-toggle[data-eq="${i.value}"]`);
          if(df) df.style.display = "none";
          if(btn) btn.classList.remove("active");
        }
        recalc();
      }));
      $all("#f-equip .qty-input").forEach(i=>i.addEventListener("input", ()=>{
        if((Number(i.value)||0)<=0){
          const df = $(`.item-date-fields[data-eq-dates="${i.dataset.eq}"]`);
          const btn = $(`.item-date-toggle[data-eq="${i.dataset.eq}"]`);
          if(df) df.style.display = "none";
          if(btn) btn.classList.remove("active");
        }
        recalc();
      }));
      $all(".item-date-toggle").forEach(btn=> btn.addEventListener("click", ()=>{
        const eqId = btn.dataset.eq;
        const df = $(`.item-date-fields[data-eq-dates="${eqId}"]`);
        const show = df.style.display === "none";
        df.style.display = show ? "flex" : "none";
        btn.classList.toggle("active", show);
        if(show){
          const s = df.querySelector(".item-date-start"), e = df.querySelector(".item-date-end");
          if(!s.value) s.value = $("#f-start").value || todayISO();
          if(!e.value) e.value = $("#f-end").value || isoAddDays(todayISO(),3);
        }
        recalc();
      }));
      $all(".item-date-start, .item-date-end").forEach(i=> i.addEventListener("change", recalc));
      if($("#f-serv")) $all("#f-serv input").forEach(i=>i.addEventListener("change", recalc));
      $("#f-value").addEventListener("input", ()=>{ $("#f-value").dataset.touched="1"; });
      $("#f-client").addEventListener("change", refreshLocPicker);
      $("#f-loc-picker").addEventListener("change", ()=>{
        const locs = clientLocationOptions($("#f-client").value);
        const loc = locs.find(l=>l.id===$("#f-loc-picker").value);
        if(loc) $("#f-loc").value = loc.address;
      });
      refreshLocPicker();
      recalc();
      if($("#duplicate-contract")) $("#duplicate-contract").addEventListener("click", ()=>{
        const duration = Math.max(daysBetween(c.startDate,c.endDate),1);
        const start = todayISO();
        const clone = { code:c.code, clientId:c.clientId, equipmentIds:[...(c.equipmentIds||[])], itemDates: c.itemDates?{...c.itemDates}:undefined, value:c.value, freight:c.freight, location:c.location, notes:c.notes, startDate:start, endDate:isoAddDays(start,duration) };
        closeModal();
        contractFormModal(null, "orcamento", clone);
      });
      $("#save-contract").addEventListener("click", async ()=>{
        const clientId = $("#f-client").value;
        if(!clientId){ toast("Selecione um cliente.","err"); return; }
        const qtyIds = [];
        $all("#f-equip .qty-input").forEach(i=>{ const qty=Math.max(Number(i.value)||0,0); for(let n=0;n<qty;n++) qtyIds.push(i.dataset.eq); });
        const equipmentIds = [...$all("#f-equip input[type=checkbox]:checked").map(i=>i.value), ...qtyIds, ...($("#f-serv")?$all("#f-serv input:checked").map(i=>i.value):[])];
        const start=$("#f-start").value, end=$("#f-end").value;
        if(end < start){ toast("A data de devolução não pode ser antes do início.","err"); return; }
        const newItemDates = {};
        $all(".item-date-fields").forEach(df=>{
          if(df.style.display==="none") return;
          const eqId = df.dataset.eqDates;
          const s = df.querySelector(".item-date-start").value, e = df.querySelector(".item-date-end").value;
          if(eqId && s && e && equipmentIds.includes(eqId)) newItemDates[eqId] = {start:s, end:e};
        });
        const status = $("#f-status").value;
        const freight = $("#f-freight-on").checked ? (Number($("#f-freight").value)||0) : null;
        const data = { clientId, equipmentIds, itemDates:newItemDates, startDate:start, endDate:end, value:Number($("#f-value").value)||0, freight, location:$("#f-loc").value.trim(), notes:$("#f-notes").value.trim(), status, signed:$("#f-signed").checked };
        if(!c) data.code = "LF-"+String(STATE.contracts.length+1).padStart(4,"0");
        if(status!=="cancelado" && c?.returnedDate) data.returnedDate = c.returnedDate;
        await saveDoc("contracts", c?.id, data);
        await syncEquipmentStatusForContract({...(c||{}), ...data, id:c?.id});
        closeModal(); toast(c?"Contrato atualizado.":"Contrato criado.","ok");
      });
  }});
}
async function syncEquipmentStatusForContract(c){
  const computed = contractComputedStatus(c);
  const isOccupying = ["ativo","vencendo_hoje","atrasado"].includes(computed);
  const seen = new Set();
  for(const eqId of (c.equipmentIds||[])){
    if(seen.has(eqId)) continue; seen.add(eqId);
    const eq = byId(STATE.equipment, eqId);
    if(!eq || !isEquipKind(eq) || isStockMode(eq) || eq.status==="manutencao") continue;
    const shouldBe = isOccupying ? "alugado" : "disponivel";
    if(eq.status !== shouldBe) await saveDoc("equipment", eq.id, {status:shouldBe});
  }
}
function returnContract(id){
  confirmDialog("Registrar a devolução deste contrato hoje? Os equipamentos voltarão a ficar disponíveis.", async ()=>{
    const c = byId(STATE.contracts,id);
    await saveDoc("contracts", id, { returnedDate: todayISO(), status:"devolvido" });
    const seen = new Set();
    for(const eqId of (c.equipmentIds||[])){
      if(seen.has(eqId)) continue; seen.add(eqId);
      const eq = byId(STATE.equipment,eqId);
      if(eq && isEquipKind(eq) && !isStockMode(eq) && eq.status!=="manutencao") await saveDoc("equipment", eqId, {status:"disponivel"});
    }
    toast("Devolução registrada.","ok");
  });
}

/* Preenche o modelo de contrato com os dados do cliente e do(s) equipamento(s) do contrato — o texto se adapta sozinho a cada locação. */
function fillContractTemplate(template, c){
  const cl = c ? byId(STATE.clients, c.clientId) : null;
  const qtyById = {};
  (c?.equipmentIds||[]).forEach(eid=>{ qtyById[eid] = (qtyById[eid]||0)+1; });
  const eqs = c ? Object.keys(qtyById).map(eid=>byId(STATE.equipment,eid)).filter(Boolean) : [];
  const itemDatesMap = c?.itemDates || {};
  const itens = eqs.length
    ? eqs.map(e=>{
        const ov = itemDatesMap[e.id];
        const ovNote = ov ? ` — período: ${fmtDate(ov.start)} a ${fmtDate(ov.end)}` : "";
        return `- ${e.name}${qtyById[e.id]>1?` ×${qtyById[e.id]}`:""}${e.category?` (${e.category})`:""}${e.code?` — código ${e.code}`:""} — ${isEquipKind(e)?equipmentRateSummary(e):fmtMoney(e.dailyRate)}${ovNote}`;
      }).join("\n")
    : "- [equipamento(s) do contrato]";
  const days = c && c.startDate && c.endDate ? Math.max(daysBetween(c.startDate,c.endDate),1) : null;
  const map = {
    "{{codigo}}": c?.code || "[código]",
    "{{empresa_nome}}": STATE.company.name || "Locarion",
    "{{empresa_cnpj}}": STATE.company.cnpj || "[CNPJ da locadora]",
    "{{empresa_telefone}}": STATE.company.phone || "[telefone da locadora]",
    "{{empresa_endereco}}": STATE.company.address || "[endereço da locadora]",
    "{{multa_atraso}}": STATE.company.lateFeePercent!=null ? `${STATE.company.lateFeePercent}%` : "[percentual de multa]",
    "{{cliente_nome}}": cl?.name || "[nome do cliente]",
    "{{cliente_documento}}": cl?.document || "[CPF/CNPJ]",
    "{{cliente_telefone}}": cl?.phone || "[telefone]",
    "{{cliente_endereco}}": cl?.address || "[endereço do cliente]",
    "{{itens}}": itens,
    "{{data_inicio}}": c?.startDate ? fmtDate(c.startDate) : "[data de início]",
    "{{data_fim}}": c?.endDate ? fmtDate(c.endDate) : "[data de devolução]",
    "{{dias}}": days!=null ? String(days) : "[dias]",
    "{{valor}}": c && c.value!=null ? fmtMoney(c.value) : "[valor]",
    "{{frete}}": c && c.freight ? fmtMoney(c.freight) : "sem cobrança de frete",
    "{{local}}": c?.location || "[local de uso]",
    "{{data_hoje}}": fmtDate(todayISO()),
    "{{clausulas_operacionais}}": STATE.company.operationalClauses || "",
  };
  let out = template || "";
  for(const [k,v] of Object.entries(map)) out = out.split(k).join(v);
  return out;
}
function contractDocModal(id){
  const c = byId(STATE.contracts, id);
  const template = STATE.company.contractTemplate || DEFAULT_CONTRACT_TEMPLATE;

function agendaRow(c,date){

function renderCalendar(){
  const y = CAL_MONTH.getFullYear(), m = CAL_MONTH.getMonth();
  const first = new Date(y,m,1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const today = todayISO();
  const active = STATE.contracts.filter(c=>contractComputedStatus(c)!=="cancelado" && contractComputedStatus(c)!=="orcamento");
  let cells = "";
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell outside"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const outs = active.filter(c=>c.startDate===iso);
    const ins = active.filter(c=>c.endDate===iso && !c.returnedDate || (c.returnedDate===iso));
    let evts = "";
    outs.slice(0,2).forEach(c=> evts += `<div class="cal-evt" style="background:var(--accent-soft);color:var(--accent-soft-ink)" title="Retirada: ${escapeHtml(clientName(c.clientId))}">↗ ${escapeHtml(clientName(c.clientId))}</div>`);
    ins.slice(0,2).forEach(c=>{ const st=contractComputedStatus(c); const cls = st==='atrasado'?'st-critical':st==='vencendo_hoje'?'st-warning':'st-good'; const colors={'st-critical':['var(--critical-bg)','var(--critical)'],'st-warning':['var(--warning-bg)','var(--warning)'],'st-good':['var(--good-bg)','var(--good)']}[cls]; evts += `<div class="cal-evt" style="background:${colors[0]};color:${colors[1]}" title="Devolução: ${escapeHtml(clientName(c.clientId))}">↙ ${escapeHtml(clientName(c.clientId))}</div>`; });
    cells += `<div class="cal-cell ${iso===today?'today':''}"><div class="d">${d}</div>${evts}</div>`;
  }
  $("#cal-card").innerHTML = `
    <div class="cal-head">
      <h3 class="section-title">${first.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</h3>
      <div style="display:flex;gap:6px">
        <button class="icon-btn" data-action="cal-prev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg></button>
        <button class="icon-btn" data-action="cal-today"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="icon-btn" data-action="cal-next"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </div>
    <div class="cal-grid">
      ${["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(d=>`<div class="cal-dow">${d}</div>`).join("")}
      ${cells}
    </div>
  `;
}

/* Sugere manutenção preventiva para equipamentos com intervalo definido, sem manutenção pendente já agendada. */
function suggestedPreventiveMaintenance(){
  const out = [];
  fleetOnly(STATE.equipment).forEach(e=>{
    if(!e.maintenanceIntervalMonths) return;
    const hasPending = STATE.maintenance.some(m=>m.equipmentId===e.id && !m.completedDate);
    if(hasPending) return;
    const completed = STATE.maintenance.filter(m=>m.equipmentId===e.id && m.completedDate).sort((a,b)=>b.completedDate.localeCompare(a.completedDate));
    if(!completed.length) return;
    const due = isoAddDays(completed[0].completedDate, e.maintenanceIntervalMonths*30);
    if(due <= isoAddDays(todayISO(),14)) out.push({equipment:e, due, overdue: due < todayISO()});
  });
  return out.sort((a,b)=>a.due.localeCompare(b.due));
}

  $("#mt-status").value = f.status;
  $("#mt-search").addEventListener("input", debounce(e=>{ f.q=e.target.value; renderMaintTable(); },150));

function renderDespesasBody(){

function exportFinanceCSV(){
  const rows = [["Cliente","Descrição","Vencimento","Forma de pagamento","Status","Valor"]];
  STATE.payments.forEach(p=> rows.push([clientName(p.clientId), p.description||"", p.dueDate, PAYMENT_METHODS[p.method]||p.method, paymentStatusMeta(paymentComputedStatus(p)).label, (p.amount||0).toFixed(2).replace(".",",")]));
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  try{
    downloadBlob(`locarion-financeiro-${todayISO()}.csv`, new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}));
    toast("CSV exportado.","ok");
  }catch(err){
    toast("Não foi possível exportar agora.","err");
  }
}

function renderClientsTable(){
  const q = FILTERS.clientes.q.toLowerCase();
  let list = STATE.clients.filter(c=> !q || (c.name+" "+(c.document||"")).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  const wrap = $("#cl-table-wrap");
  if(!list.length){ wrap.innerHTML = emptyState("Nenhum cliente encontrado","Ajuste a busca ou cadastre um novo cliente."); return; }
  wrap.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Contato</th><th>Contratos ativos</th><th class="num">Faturas em aberto</th><th>Status</th><th></th></tr></thead><tbody>
    ${list.map(c=>{
      const ativos = STATE.contracts.filter(ct=>ct.clientId===c.id && ["ativo","vencendo_hoje","atrasado"].includes(contractComputedStatus(ct))).length;
      const open = STATE.payments.filter(p=>p.clientId===c.id && paymentComputedStatus(p)!=="pago");
      const openSum = open.reduce((s,p)=>s+Number(p.amount||0),0);
      const inativo = c.status==="inativo";
      return `<tr style="cursor:pointer" data-action="view-client" data-id="${c.id}">

        <td class="cell-sub">${escapeHtml(c.phone||"—")}</td>
        <td>${ativos}</td>
        <td class="num tabular">${openSum>0?`<span style="color:var(--warning);font-weight:700">${fmtMoney(openSum)}</span>`:fmtMoney(0)}</td>
        <td><span class="badge ${inativo?'st-neutral':'st-good'}"><span class="dot"></span>${inativo?'Inativo':'Ativo'}</span></td>
        <td><div class="row-actions">
          <button class="icon-btn" title="Editar" data-action="edit-client" data-id="${c.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button class="icon-btn" title="Excluir" data-action="delete-client" data-id="${c.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>

  </tbody></table></div>`;

  const months = []; for(let i=5;i>=0;i--){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); months.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")); }
  const revenueByMonth = months.map(k=>STATE.payments.filter(p=>p.paidDate && monthKey(p.paidDate)===k).reduce((s,p)=>s+Number(p.amount||0),0));
  const expenseByMonth = months.map(k=>STATE.expenses.filter(e=>e.paidDate && monthKey(e.paidDate)===k).reduce((s,e)=>s+Number(e.amount||0),0));
  const contractsByMonth = months.map(k=>STATE.contracts.filter(c=>monthKey(c.startDate)===k).length);

  const methodTotals = Object.keys(PAYMENT_METHODS).map((k,i)=>({label:PAYMENT_METHODS[k], value:STATE.payments.filter(p=>p.method===k).reduce((s,p)=>s+Number(p.amount||0),0), color:["var(--series-1)","var(--series-2)","var(--series-3)","var(--series-4)","var(--series-5)"][i]})).filter(x=>x.value>0);

  const fleetR = fleetOnly(STATE.equipment).filter(e=>!isStockMode(e));
  const eqDisp = fleetR.filter(e=>e.status==="disponivel").length;

  const payables = STATE.expenses.filter(e=>expenseComputedStatus(e)!=="pago").sort((a,b)=>(a.date||"").localeCompare(b.date||"")).slice(0,5);
  const boletos = STATE.payments.filter(p=>p.method==="boleto").sort((a,b)=>b.dueDate.localeCompare(a.dueDate));

  STATE.maintenance.forEach(m=>{ if(m.cost) maintCostByEq[m.equipmentId] = (maintCostByEq[m.equipmentId]||0) + Number(m.cost); });
  const maintCostRows = Object.entries(maintCostByEq).sort((a,b)=>b[1]-a[1]);

      <div class="chart-card">

        ${columnChart(months.map((k,i)=>({label:monthLabel(k),series:[{value:revenueByMonth[i],color:"var(--series-1)",name:"Receita"}]})),{money:true})}
      </div>
      <div class="chart-card">
        <div class="chart-card-head"><h3 class="section-title" style="font-size:14px">Recebimentos por forma de pagamento</h3></div>
        ${methodTotals.length? `<div style="display:flex;align-items:center;gap:18px">${donutChart(methodTotals,132)}<div style="flex:1">${chartLegend(methodTotals.map(m=>({label:m.label+" · "+fmtMoney(m.value),color:m.color})))}</div></div>` : `<p class="hint">Sem recebimentos registrados ainda.</p>`}
      </div>
    </div>
    <div class="grid-2" style="margin-bottom:16px">
      <div class="chart-card">
        <div class="chart-card-head"><h3 class="section-title" style="font-size:14px">Receitas vs. despesas · últimos 6 meses</h3></div>
        ${columnChart(months.map((k,i)=>({label:monthLabel(k),series:[{value:revenueByMonth[i],color:"var(--series-1)",name:"Receita"},{value:expenseByMonth[i],color:"var(--series-2)",name:"Despesa"}]})),{money:true})}

      </div>
      <div class="chart-card">
        <div class="chart-card-head"><h3 class="section-title" style="font-size:14px">Disponibilidade de equipamentos</h3></div>

      </div>
    </div>
    <div class="chart-card" style="margin-bottom:16px">
      <div class="chart-card-head"><h3 class="section-title" style="font-size:14px">Contratos iniciados por mês</h3></div>
