const ADMIN_PLAN_LABEL = { profissional:"Profissional", enterprise:"Enterprise" };
const ADMIN_STATUS_META = {
  active:{label:"Ativa",cls:"st-good"},
  inactive:{label:"Inativa",cls:"st-neutral"},
  canceled:{label:"Cancelada",cls:"st-critical"},
};
async function fetchAdminUsers(){
  const fn = firebase.app().functions("southamerica-east1").httpsCallable("adminListUsers");
  const { data } = await fn();
  ADMIN_USERS = data.users || [];
  ADMIN_LOADED = true;
}
function renderAdmin(){
  setTopbarActions("");
  const view = $("#view");
  if(!IS_ADMIN){
    view.innerHTML = emptyState("Acesso restrito","Esta área é exclusiva da administração do Locarion.");
    return;
  }
  if(!ADMIN_LOADED){
    view.innerHTML = loadingView();
    fetchAdminUsers().then(renderRoute).catch(err=>{
      console.error(err);
      view.innerHTML = emptyState("Não foi possível carregar","Tente novamente em instantes.");
    });
    return;
  }
  const rows = ADMIN_USERS.map(u=>{
    const statusOpts = Object.keys(ADMIN_STATUS_META).map(s=>`<option value="${s}" ${u.subscriptionStatus===s?"selected":""}>${ADMIN_STATUS_META[s].label}</option>`).join("");
    const planOpts = Object.keys(ADMIN_PLAN_LABEL).map(p=>`<option value="${p}" ${u.plan===p?"selected":""}>${ADMIN_PLAN_LABEL[p]}</option>`).join("");
    const meta = ADMIN_STATUS_META[u.subscriptionStatus] || {label:u.subscriptionStatus||"—",cls:"st-neutral"};
    return `<tr data-uid="${u.id}">
      <td><div class="name-cell"><div class="avatar">${initials(u.name||u.email||"?")}</div><div style="min-width:0"><div class="cell-title">${escapeHtml(u.name||"—")}${u.isAdmin?' <span class="badge st-accent" style="margin-left:6px"><span class="dot"></span>Admin</span>':""}</div><div class="cell-sub">${escapeHtml(u.email||"")}</div></div></div></td>
      <td><select class="select admin-plan-select">${planOpts}</select></td>
      <td><select class="select admin-status-select">${statusOpts}</select></td>
      <td><span class="badge ${meta.cls}"><span class="dot"></span>${meta.label}</span></td>
      <td class="row-actions"><button class="btn btn-primary btn-sm" data-action="admin-save-user" data-id="${u.id}">Salvar</button></td>
    </tr>`;
  }).join("");
  view.innerHTML = `
    <div class="card" style="margin-bottom:16px"><div class="card-pad"><h3 class="section-title">Clientes do Locarion</h3><p class="hint">Gerencie plano e status de assinatura de qualquer conta cadastrada no sistema.</p></div></div>
    ${ADMIN_USERS.length ? `<div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Plano</th><th>Alterar status</th><th>Status atual</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : emptyState("Nenhum cliente cadastrado ainda","Assim que alguém assinar, a conta aparece aqui.")}
  `;
}
async function adminSaveUser(targetUid, btn){
  const tr = document.querySelector(`tr[data-uid="${targetUid}"]`);
  const plan = tr.querySelector(".admin-plan-select").value;
  const subscriptionStatus = tr.querySelector(".admin-status-select").value;
  btn.disabled = true; const original = btn.textContent; btn.textContent = "Salvando...";
  try{
    const fn = firebase.app().functions("southamerica-east1").httpsCallable("adminSetUserAccess");
    await fn({ targetUid, plan, subscriptionStatus });
    toast("Cliente atualizado.","ok");
    ADMIN_LOADED = false;
    renderAdmin();
  }catch(err){
    console.error(err);
    toast("Não foi possível salvar. Tente novamente.","err");
    btn.disabled = false; btn.textContent = original;
  }
}

function renderHistoricoEncerradosTable(){
  const f = FILTERS.historico;
  let list = STATE.contracts.filter(c=> ["devolvido","cancelado"].includes(contractComputedStatus(c)));
  if(f.q){ const q=f.q.toLowerCase(); list = list.filter(c=> clientName(c.clientId).toLowerCase().includes(q)); }
  const endOf = c=> c.returnedDate || c.endDate;
  if(f.from) list = list.filter(c=> endOf(c) >= f.from);
  if(f.to) list = list.filter(c=> endOf(c) <= f.to);
  list = list.sort((a,b)=> (endOf(b)||"").localeCompare(endOf(a)||""));
  const wrap = $("#hist-enc-table");
  if(!list.length){ wrap.innerHTML = emptyState("Nenhum contrato encerrado encontrado","Ajuste os filtros de busca."); return; }
  wrap.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Código</th><th>Cliente</th><th>Equipamento(s)</th><th>Início</th><th>Encerrado em</th><th>Status</th><th class="num">Valor</th></tr></thead><tbody>
    ${list.map(c=>{ const meta=contractStatusMeta(contractComputedStatus(c)); return `<tr data-action="edit-contract" data-id="${c.id}" style="cursor:pointer">

      <td class="num tabular">${fmtMoney(c.value)}</td>
    </tr>`; }).join("")}
  </tbody></table></div>`;
}

function nextAvailableDate(eq){
  if(eq.status==="alugado"){ const c=activeContractForEquipment(eq.id); return c?c.endDate:null; }
  if(eq.status==="manutencao"){ const m=STATE.maintenance.filter(x=>x.equipmentId===eq.id && !x.completedDate).sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate))[0]; return m?m.scheduledDate:null; }
  return null;
}
function nextAvailableDateStock(eq){
  const dates = STATE.contracts.filter(c=> (c.equipmentIds||[]).includes(eq.id) && ["ativo","vencendo_hoje","atrasado"].includes(contractComputedStatus(c)))
    .map(c=> (c.itemDates && c.itemDates[eq.id] && c.itemDates[eq.id].end) || c.endDate).filter(Boolean).sort();
  return dates[0] || null;
}

/* Orçamento rápido: simula o valor de uma locação sem precisar criar contrato — não fica salvo, é só uma estimativa. */
function renderOrcamentoRapido(){
  setTopbarActions("");
  const wrap = $("#orc-body");
  const items = []; /* {equipmentId, qty, days} — vive só enquanto a tela está aberta */
  wrap.innerHTML = `
    <div class="card card-pad" style="margin-bottom:16px">
      <h3 class="section-title" style="margin-bottom:4px">Orçamento rápido</h3>
      <p class="hint" style="margin-bottom:12px">Simule o valor de uma locação sem precisar criar um contrato ou proposta. Nada aqui é salvo.</p>
      <div class="field"><label>Cliente (opcional)</label><select class="select" id="qr-client"><option value="">Sem cliente</option>${STATE.clients.map(cl=>`<option value="${cl.id}">${escapeHtml(cl.name)}</option>`).join("")}</select></div>
      <div class="field-row" style="align-items:flex-end">
        <div class="field" style="flex:2"><label>Equipamento ou serviço</label><select class="select" id="qr-eq">${STATE.equipment.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}</option>`).join("") || '<option value="">Cadastre um equipamento primeiro</option>'}</select></div>
        <div class="field" style="flex:0 0 90px"><label>Qtd. dias</label><input class="input" type="number" min="1" id="qr-days" value="1"></div>
        <div class="field" style="flex:0 0 70px"><label>Qtde.</label><input class="input" type="number" min="1" id="qr-qty" value="1"></div>
        <button class="btn btn-secondary" id="qr-add" style="margin-bottom:1px">+ Adicionar item</button>
      </div>
    </div>
    <div class="card">
      <div class="table-wrap" style="border:none;border-radius:0"><table><thead><tr><th>Item</th><th>Tarifa</th><th>Dias</th><th>Qtde.</th><th class="num">Total</th><th></th></tr></thead><tbody id="qr-rows">
        <tr><td colspan="6" class="hint" style="padding:14px">Nenhum item adicionado ainda.</td></tr>
      </tbody></table></div>
      <div class="card-pad" style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border)">
        <div style="font-family:var(--font-display);font-weight:700;font-size:15px">Total estimado</div>
        <div id="qr-total" class="tabular" style="font-family:var(--font-display);font-weight:800;font-size:20px">${fmtMoney(0)}</div>
      </div>
      <div class="card-pad" style="display:flex;gap:8px;border-top:1px solid var(--border)">
        <button class="btn btn-secondary btn-sm" id="qr-copy">Copiar resumo</button>
        <button class="btn btn-primary btn-sm" id="qr-download">Baixar .txt</button>
      </div>
    </div>
  `;
  function renderRows(){
    const rowsEl = $("#qr-rows");
    if(!items.length){ rowsEl.innerHTML = `<tr><td colspan="6" class="hint" style="padding:14px">Nenhum item adicionado ainda.</td></tr>`; }
    else rowsEl.innerHTML = items.map((it,i)=>{
      const eq = byId(STATE.equipment, it.equipmentId);
      const rate = eq && isEquipKind(eq) ? bestRateForDays(eq, it.days) : {total:Number(eq?.dailyRate||0)*it.days, label:"diária"};
      const total = rate.total * it.qty;
      return `<tr><td class="cell-title">${escapeHtml(eq?.name||"—")}</td><td class="cell-sub">${rate.label}</td><td class="tabular">${it.days}</td><td class="tabular">${it.qty}</td><td class="num tabular">${fmtMoney(total)}</td><td><button class="icon-btn qr-remove" data-i="${i}" title="Remover"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button></td></tr>`;
    }).join("");
    let total = 0;
    items.forEach(it=>{ const eq=byId(STATE.equipment,it.equipmentId); const rate = eq && isEquipKind(eq) ? bestRateForDays(eq, it.days) : {total:Number(eq?.dailyRate||0)*it.days}; total += rate.total*it.qty; });
    $("#qr-total").textContent = fmtMoney(total);
    $all(".qr-remove").forEach(b=> b.addEventListener("click", ()=>{ items.splice(Number(b.dataset.i),1); renderRows(); }));
  }
  function buildSummaryText(){
    const cl = $("#qr-client").value ? byId(STATE.clients, $("#qr-client").value) : null;
    let total = 0;
    const lines = items.map(it=>{ const eq=byId(STATE.equipment,it.equipmentId); const rate = eq && isEquipKind(eq) ? bestRateForDays(eq, it.days) : {total:Number(eq?.dailyRate||0)*it.days, label:"diária"}; const t = rate.total*it.qty; total += t; return `- ${eq?.name||"—"} · ${rate.label} · ${it.days} dia(s) x ${it.qty} un. = ${fmtMoney(t)}`; });
    return `ORÇAMENTO RÁPIDO — ${STATE.company.name||"Locarion"}\nData: ${fmtDate(todayISO())}\nCliente: ${cl?cl.name:"não informado"}\n\nItens:\n${lines.join("\n")||"(nenhum item)"}\n\nTotal estimado: ${fmtMoney(total)}`;
  }
  $("#qr-add").addEventListener("click", ()=>{
    const eqId = $("#qr-eq").value;
    if(!eqId){ toast("Cadastre um equipamento primeiro.","err"); return; }
    items.push({ equipmentId:eqId, days:Math.max(Number($("#qr-days").value)||1,1), qty:Math.max(Number($("#qr-qty").value)||1,1) });
    renderRows();
  });
  $("#qr-copy").addEventListener("click", ()=>{
    if(navigator.clipboard?.writeText) navigator.clipboard.writeText(buildSummaryText()).then(()=>toast("Resumo copiado.","ok")).catch(()=>toast("Não foi possível copiar.","err"));
  });
  $("#qr-download").addEventListener("click", ()=>{
    try{
      downloadBlob(`orcamento-rapido-${todayISO()}.txt`, new Blob([buildSummaryText()],{type:"text/plain;charset=utf-8"}));
      toast("Orçamento baixado.","ok");
    }catch(e){}
  });
  renderRows();
}
function convertQuote(id){
  confirmDialog("Converter este orçamento em contrato ativo? Os equipamentos selecionados passarão a ficar reservados.", async ()=>{
    const c = byId(STATE.contracts,id);
    const status = c.startDate > todayISO() ? "agendado" : "ativo";
    await saveDoc("contracts", id, {status});
    await syncEquipmentStatusForContract({...c, status});
    toast("Orçamento convertido em contrato.","ok");
  });
}

function monthLabelLong(key){ if(!key) return ""; const [y,m]=key.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); }
function shiftMonthKey(key, delta){ const [y,m]=key.split("-").map(Number); const d=new Date(y,m-1+delta,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function renderContasPR(){
  setTopbarActions("");
  const view = $("#view");
  if(!allLoaded()){ view.innerHTML = loadingView(); return; }
  const f = FILTERS.contaspr;
  const month = f.month;
  let receivables = STATE.payments.filter(p=>paymentComputedStatus(p)!=="pago");
  let payables = STATE.expenses.filter(e=>expenseComputedStatus(e)!=="pago");
  if(month){ receivables = receivables.filter(p=>monthKey(p.dueDate)===month); payables = payables.filter(e=>monthKey(e.date)===month); }
  receivables.sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  payables.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const totalR = receivables.reduce((s,p)=>s+Number(p.amount||0),0);
  const totalP = payables.reduce((s,e)=>s+Number(e.amount||0),0);
  view.innerHTML = `
    <div class="filters-row" style="align-items:center">
      ${month ? `<button class="icon-btn" id="cpr-prev" title="Mês anterior"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>

    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-top"><span class="kpi-label">Total a receber</span></div><div class="kpi-value tabular" style="color:var(--warning)">${fmtMoney(totalR)}</div><div class="kpi-sub">${receivables.length} faturas</div></div>
      <div class="kpi"><div class="kpi-top"><span class="kpi-label">Total a pagar</span></div><div class="kpi-value tabular">${fmtMoney(totalP)}</div><div class="kpi-sub">${payables.length} despesas</div></div>
      <div class="kpi"><div class="kpi-top"><span class="kpi-label">Saldo projetado</span></div><div class="kpi-value tabular" style="color:${(totalR-totalP)>=0?'var(--good)':'var(--critical)'}">${fmtMoney(totalR-totalP)}</div></div>
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-pad"><h3 class="section-title">A receber</h3></div>
        ${receivables.length? `<div class="table-wrap" style="border:none;border-radius:0"><table><thead><tr><th>Cliente</th><th>Vencimento</th><th class="num">Valor</th><th></th></tr></thead><tbody>
          ${receivables.map(p=>{ const meta=paymentStatusMeta(paymentComputedStatus(p)); return `<tr><td>${escapeHtml(clientName(p.clientId))}</td><td class="tabular">${fmtDate(p.dueDate)} <span class="badge ${meta.cls}" style="margin-left:4px"><span class="dot"></span>${meta.label}</span></td><td class="num tabular">${fmtMoney(p.amount)}</td><td><button class="icon-btn" title="Marcar como pago" data-action="pay-payment" data-id="${p.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg></button></td></tr>`; }).join("")}
        </tbody></table></div>` : emptyState("Nada a receber","Todas as faturas estão pagas.")}
      </div>
      <div class="card">
        <div class="card-pad"><h3 class="section-title">A pagar</h3></div>
        ${payables.length? `<div class="table-wrap" style="border:none;border-radius:0"><table><thead><tr><th>Descrição</th><th>Data</th><th class="num">Valor</th><th></th></tr></thead><tbody>
          ${payables.map(e=>{ const meta=paymentStatusMeta(expenseComputedStatus(e)); return `<tr><td class="cell-title">${escapeHtml(e.description)}</td><td class="tabular">${fmtDate(e.date)} <span class="badge ${meta.cls}" style="margin-left:4px"><span class="dot"></span>${meta.label}</span></td><td class="num tabular">${fmtMoney(e.amount)}</td><td><button class="icon-btn" title="Marcar como pago" data-action="pay-expense" data-id="${e.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg></button></td></tr>`; }).join("")}
        </tbody></table></div>` : emptyState("Nada a pagar","Todas as despesas estão em dia.")}
      </div>
    </div>
  `;
  if($("#cpr-month")) $("#cpr-month").addEventListener("click", ()=>{ f.month = monthKey(todayISO()); renderContasPR(); });
  if($("#cpr-all")) $("#cpr-all").addEventListener("click", ()=>{ f.month = null; renderContasPR(); });

    <p class="hint" style="margin-bottom:12px">Controle simples de documentação: marque um contrato como assinado assim que o cliente formalizar.</p>
    ${list.length? `<div class="table-wrap"><table><thead><tr><th>Código</th><th>Cliente</th><th>Situação do contrato</th><th>Local</th><th>Assinatura</th><th></th></tr></thead><tbody>
      ${list.map(c=>{ const meta=contractStatusMeta(contractComputedStatus(c)); return `<tr>
        <td class="cell-title tabular">${escapeHtml(c.code)}</td>
        <td>${escapeHtml(clientName(c.clientId))}</td>
        <td><span class="badge ${meta.cls}"><span class="dot"></span>${meta.label}</span></td>
        <td class="cell-sub">${escapeHtml(c.location||"—")}</td>
        <td>${c.signed? `<span class="badge st-good"><span class="dot"></span>Assinado</span>` : `<span class="badge st-warning"><span class="dot"></span>Pendente</span>`}</td>
        <td><div class="row-actions">
          <button class="btn btn-secondary btn-sm" data-action="gen-contract-doc" data-id="${c.id}">Ver contrato</button>
          <button class="btn btn-secondary btn-sm" data-action="toggle-signed" data-id="${c.id}">${c.signed?"Marcar pendente":"Marcar assinado"}</button>
        </div></td>
      </tr>`; }).join("")}
    </tbody></table></div>` : emptyState("Nenhum contrato ainda","Contratos criados vão aparecer aqui para controle de assinatura.")}
  `;
}

/* ======================= DATA LAYER (Firestore, isolado por empresa/uid) ======================= */
let companyRef = null; /* db.collection("companies").doc(uid) — raiz dos dados desta empresa */

async function saveDoc(collection, id, data){
  if(!companyRef){ toast("Sem conexão com os dados agora. Tente novamente em instantes.","err"); return; }
  try{
    if(id) await companyRef.collection(collection).doc(id).update(data);
    else await companyRef.collection(collection).add(data);
  }catch(err){ toast("Não foi possível salvar essa alteração.","err"); }
}
async function deleteDoc(collection, id){
  if(!companyRef) return;
  try{ await companyRef.collection(collection).doc(id).delete(); }
  catch(err){ toast("Não foi possível excluir.","err"); }
}
async function saveCompany(data){
  if(!companyRef) return;
  try{ await companyRef.set(data, { merge:true }); }
  catch(err){}
}
function subscribeCollection(key){
  companyRef.collection(key).onSnapshot(
    snap=>{ STATE[key] = snap.docs.map(d=>({id:d.id, ...d.data()})); LOADED[key]=true; rerenderCurrent(); },
    ()=>{ LOADED[key]=true; rerenderCurrent(); }
  );
}
function updatePlanLabel(){
  const map={profissional:"Profissional",enterprise:"Enterprise"};
  const el = $("#plan-label"); if(el) el.textContent = map[STATE.company.plan]||"Profissional";
}
function rerenderCurrent(){ updatePlanLabel(); renderRoute(); }

/* ======================= ACTIONS ======================= */
function handleAction(action, id){
  switch(action){
    case "close-modal": closeModal(); break;
    case "new-equipment": equipmentFormModal(); break;
    case "edit-equipment": equipmentFormModal(id); break;
    case "delete-equipment": confirmDialog("Excluir este equipamento? Essa ação não pode ser desfeita.", ()=>deleteDoc("equipment",id).then(()=>toast("Equipamento excluído.","ok"))); break;
    case "history-equipment": equipmentHistoryModal(id); break;
    case "new-contract": contractFormModal(); break;
    case "edit-contract": contractFormModal(id); break;
    case "delete-contract": confirmDialog("Excluir este contrato? Essa ação não pode ser desfeita.", ()=>deleteDoc("contracts",id).then(()=>toast("Contrato excluído.","ok"))); break;
    case "return-contract": returnContract(id); break;
    case "new-maintenance": maintenanceFormModal(); break;
    case "schedule-suggested-maintenance": maintenanceFormModal(null, {equipmentId:id, scheduledDate:todayISO()}); break;
    case "edit-maintenance": maintenanceFormModal(id); break;
    case "delete-maintenance": confirmDialog("Excluir este registro de manutenção?", ()=>deleteDoc("maintenance",id).then(()=>toast("Registro excluído.","ok"))); break;
    case "complete-maintenance": completeMaintenance(id); break;
    case "new-payment": paymentFormModal(); break;
    case "edit-payment": paymentFormModal(id); break;
    case "delete-payment": confirmDialog("Excluir esta fatura?", ()=>deleteDoc("payments",id).then(()=>toast("Fatura excluída.","ok"))); break;
    case "pay-payment": payPayment(id); break;
    case "new-expense": expenseFormModal(); break;
    case "edit-expense": expenseFormModal(id); break;
    case "delete-expense": confirmDialog("Excluir esta despesa?", ()=>deleteDoc("expenses",id).then(()=>toast("Despesa excluída.","ok"))); break;
    case "pay-expense": payExpense(id); break;
    case "export-csv": exportFinanceCSV(); break;
    case "new-client": clientFormModal(); break;
    case "edit-client": closeModal(); clientFormModal(id); break;
    case "delete-client": confirmDialog("Excluir este cliente? Contratos e faturas vinculados permanecem no histórico.", ()=>deleteDoc("clients",id).then(()=>toast("Cliente excluído.","ok"))); break;
    case "view-client": clientDetailModal(id); break;
    case "go-financeiro": navigate("financeiro"); break;
    case "go-relatorios": navigate("relatorios"); break;
    case "go-clientes": navigate("clientes"); break;
    case "go-equipamentos": navigate("equipamentos"); break;
    case "go-manutencao": navigate("manutencao"); break;
    case "go-agenda": navigate("agenda"); break;
    case "cal-prev": CAL_MONTH.setMonth(CAL_MONTH.getMonth()-1); renderCalendar(); break;
    case "cal-next": CAL_MONTH.setMonth(CAL_MONTH.getMonth()+1); renderCalendar(); break;
    case "cal-today": CAL_MONTH = new Date(); renderCalendar(); break;
    case "set-plan": saveCompany({plan:id}).then(()=>toast("Plano atualizado (demonstração).","ok")); break;
    case "new-quote": contractFormModal(null,"orcamento"); break;
    case "convert-quote": convertQuote(id); break;
    case "toggle-signed": { const c=byId(STATE.contracts,id); saveDoc("contracts",id,{signed:!c.signed}).then(()=>toast(c.signed?"Marcado como pendente.":"Contrato marcado como assinado.","ok")); break; }
    case "gen-contract-doc": contractDocModal(id); break;
    case "toggle-fin-hidden": FIN_HIDDEN = !FIN_HIDDEN; renderFinanceiro(); break;
    case "admin-save-user": adminSaveUser(id, document.querySelector(`[data-action="admin-save-user"][data-id="${id}"]`)); break;
  }
}

/* ======================= BOOT ======================= */
function closeSidebarMobile(){ $("#sidebar").classList.remove("open"); $("#backdrop").classList.remove("open"); }

function showApp(){
  $("#auth-gate").hidden = true;
  $("#app").hidden = false;
}

async function boot(user){
  companyRef = db.collection("companies").doc(user.uid);

  /* chip do usuário + logout */
  $("#user-name").textContent = user.displayName || user.email || "Minha conta";
  if(user.photoURL){ $("#user-avatar").src = user.photoURL; $("#user-avatar").hidden = false; }
  $("#logout-btn").addEventListener("click", logout);
  $("#nav-group-admin").hidden = !IS_ADMIN;

  initTheme();
  window.addEventListener("hashchange", renderRoute);

  $("#menu-toggle").addEventListener("click", ()=>{ $("#sidebar").classList.toggle("open"); $("#backdrop").classList.toggle("open"); });
  $("#backdrop").addEventListener("click", closeSidebarMobile);
  $("#global-search-btn").addEventListener("click", globalSearchModal);
  $("#alerts-btn").addEventListener("click", alertsModal);
  document.addEventListener("keydown", (e)=>{
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); globalSearchModal(); }
  });

  document.addEventListener("click", (e)=>{
    const navBtn = e.target.closest("[data-nav]");
    if(navBtn){ navigate(navBtn.dataset.nav); return; }
    const themeBtn = e.target.closest("#theme-toggle [data-theme-opt]");
    if(themeBtn){ applyTheme(themeBtn.dataset.themeOpt); return; }
    const actionBtn = e.target.closest("[data-action]");
    if(actionBtn){ handleAction(actionBtn.dataset.action, actionBtn.dataset.id); }
  });

  renderRoute();
  showApp();

  ["equipment","clients","contracts","maintenance","payments","expenses"].forEach(subscribeCollection);
  companyRef.onSnapshot(
    snap=>{ if(snap.exists) STATE.company = {...STATE.company, ...snap.data()}; LOADED.company = true; rerenderCurrent(); },
    ()=>{ LOADED.company = true; rerenderCurrent(); }
  );
}

/* Só entra se: (1) autenticado no Firebase, (2) documento users/{uid} tem
   assinatura ativa OU é uma conta admin (isAdmin:true, que sempre tem acesso
   liberado, independente de pagamento). Caso contrário, volta pro login/planos. */
requireAuth(async (user) => {
  try{
    const userDoc = await db.collection("users").doc(user.uid).get();
    const data = userDoc.exists ? userDoc.data() : null;
    IS_ADMIN = !!(data && data.isAdmin === true);
    if(!data || (data.subscriptionStatus !== "active" && !IS_ADMIN)){
      window.location.href = "index.html#precos";
      return;
    }
    boot(user);
  }catch(err){
    window.location.href = "login.html";
  }
});
</script>
