<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Locarion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F6FB; --surface:#FFFFFF; --border:#E2E4F0; --border-strong:#CDD1E6;
  --ink:#12172B; --ink-2:#565C74; --ink-muted:#8B90A8;
  --accent:#2568C8; --accent-soft:#E7EFFB; --accent-soft-ink:#1D4E8C;
  --good:#127A2E; --good-bg:#E3F6EA;
  --critical:#C22F2F; --critical-bg:#FBE7E7;
  --radius-sm:8px; --radius-lg:18px;
  --shadow-md:0 10px 28px rgba(18,23,43,.10);
  --font-display:'Sora',system-ui,-apple-system,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink); font-family:var(--font-body); padding:20px}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-md); padding:40px 36px; max-width:400px; width:100%; text-align:center}
.brand{display:flex; align-items:center; justify-content:center; gap:9px; font-family:var(--font-display); font-weight:700; font-size:19px; margin-bottom:28px}
.brand-mark{width:28px; height:28px; border-radius:7px; background:var(--accent); display:flex; align-items:center; justify-content:center}
h1{font-family:var(--font-display); font-size:21px; margin:0 0 8px}
p.sub{color:var(--ink-2); font-size:14.5px; margin:0 0 26px}
.plan-banner{background:var(--good-bg); color:var(--good); font-size:13.5px; font-weight:600; padding:10px 14px; border-radius:var(--radius-sm); margin-bottom:22px}
.btn-google{
  width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
  background:#fff; border:1px solid var(--border-strong); border-radius:var(--radius-sm);
  padding:13px 16px; font-family:var(--font-body); font-weight:600; font-size:15px; color:var(--ink);
  cursor:pointer; transition:background .15s ease, box-shadow .15s ease;
}
.btn-google:hover{background:#F7F8FD}
.btn-google:disabled{opacity:.6; cursor:default}
.hint{margin-top:22px; font-size:12.5px; color:var(--ink-muted)}
.hint a{color:var(--accent); text-decoration:none}
.error{margin-top:16px; background:var(--critical-bg); color:var(--critical); font-size:13.5px; padding:10px 14px; border-radius:var(--radius-sm); display:none}
.error.show{display:block}
.spinner{width:16px; height:16px; border:2px solid var(--border-strong); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; display:none}
.spinner.show{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="4" y="9" width="11" height="11" rx="2" fill="white" opacity=".55"/><rect x="9" y="4" width="11" height="11" rx="2" fill="white"/></svg></div>
    Locarion
  </div>

  <h1>Acesse sua conta</h1>
  <p class="sub">O login é feito exclusivamente com sua conta Google.</p>

  <div class="plan-banner" id="plan-banner" style="display:none"></div>

  <button class="btn-google" id="google-btn">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3 16.3 3 9.7 7.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 36.4 26.7 37 24 37c-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.6 40.5 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.2 5.2C40.9 36 44 30.6 44 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
    <span id="google-btn-label">Entrar com Google</span>
    <span class="spinner" id="google-spinner"></span>
  </button>

  <div class="error" id="error-box"></div>

  <p class="hint">Ainda não assinou? <a href="index.html#precos">Veja os planos</a></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* checkout_token vem da Cloud Function createAsaasCheckout (ver index.html).
   Nunca confiamos direto nesse parâmetro: a assinatura só é ativada depois
   que a Cloud Function confirmSubscription verificar no servidor que o
   Asaas realmente confirmou o pagamento (via webhook). */
const params = new URLSearchParams(window.location.search);
const checkoutToken = params.get("checkout_token");
const plan = params.get("plan");
const functionsRegion = firebase.app().functions("southamerica-east1");

if(checkoutToken){
  const banner = document.getElementById("plan-banner");
  banner.style.display = "block";
  banner.textContent = "Pagamento recebido" + (plan ? " — plano " + (plan === "enterprise" ? "Enterprise" : "Profissional") : "") + ". Entre com o Google pra liberar o acesso.";
}

function showError(msg){
  const box = document.getElementById("error-box");
  box.textContent = msg;
  box.classList.add("show");
}

async function upsertProfile(user){
  const ref = db.collection("users").doc(user.uid);
  await ref.set({
    email: user.email,
    name: user.displayName || "",
    photoURL: user.photoURL || "",
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  }, { merge: true });
}

function setLoading(isLoading){
  document.getElementById("google-btn").disabled = isLoading;
  document.getElementById("google-btn-label").textContent = isLoading ? "Entrando..." : "Entrar com Google";
  document.getElementById("google-spinner").classList.toggle("show", isLoading);
}

document.getElementById("google-btn").addEventListener("click", async () => {
  setLoading(true);
  try{
    const result = await auth.signInWithPopup(googleProvider);
    await upsertProfile(result.user);

    if(checkoutToken){
      try{
        const confirmSubscription = functionsRegion.httpsCallable("confirmSubscription");
        await confirmSubscription({ token: checkoutToken, plan });
      }catch(err){
        console.error(err);
        setLoading(false);
        showError("Login feito, mas não conseguimos confirmar o pagamento ainda. Se você já pagou, aguarde 1 minuto e recarregue esta página.");
        return;
      }
    }

    window.location.href = "dashboard.html";
  }catch(err){
    setLoading(false);
    if(err.code === "auth/popup-closed-by-user") return;
    showError("Não foi possível entrar com o Google. Tente novamente.");
  }
});

/* Se já estiver logado e não vier de um checkout fresco, manda direto pro dashboard
   (o próprio dashboard confere se a assinatura está ativa). */
auth.onAuthStateChanged((user) => {
  if(user && !checkoutToken){
    window.location.href = "dashboard.html";
  }
});
</script>
</body>
</html>
